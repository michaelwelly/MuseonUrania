# Наложение для показа правок: сайт в контейнере, но с исходниками с машины.
#
# Зачем оно есть. В обычном стеке образ сайта несёт исходники внутри, а
# страницы собираются на старте контейнера. Это правильно для того, что уедет
# на сервер, и неудобно, когда правку надо показать: каждое изменение цвета
# требует пересборки образа, а до тех пор на 3000 висит код той сборки,
# которая была час или сутки назад.
#
# Здесь сайт запускается в режиме разработки, а каталог frontend примонтирован
# с машины. Правка файла видна на http://localhost:3000 сразу, контейнер при
# этом остаётся контейнером: тот же порт, та же сеть, те же адреса портала
# и Keycloak, что у остального стека.
#
# Как поднять:
#
#   docker compose -f backend/compose.yaml -f backend/compose.dev.yaml \
#     --profile app up -d site
#
# Как вернуть обычный режим:
#
#   docker compose -f backend/compose.yaml --profile app up -d --build site
#
# Что это НЕ заменяет: проверку того, что уедет на сервер. Режим разработки
# собирает страницы по запросу, а обычный — заранее, и различия между ними
# ловятся только обычным режимом. Перед тем как показывать заказчику
# результат как готовый, стек надо поднять без этого наложения.

services:
  site:
    # Образ тот же — из него берутся node_modules, собранные под Linux.
    # Ставить их заново на каждый запуск не нужно.
    #
    # --webpack, а не Turbopack по умолчанию, и это вынужденно. Через bind
    # mount с Windows события файловой системы до контейнера не доходят:
    # правка в файл приезжает, а уведомления о ней нет. Лечится опросом,
    # но WATCHPACK_POLLING понимает webpack, а Turbopack — нет, и с ним
    # контейнер отдаёт старую страницу, хотя файл внутри уже новый.
    # Webpack в разработке медленнее; здесь это дешевле, чем правка,
    # которую не видно.
    command: sh -c "npm run dev -- --webpack --hostname 0.0.0.0 --port 3000"

    volumes:
      # Исходники с машины поверх тех, что лежат в образе.
      - ../frontend:/app

      # Два безымянных тома поверх монтирования — они обязательны.
      #
      # node_modules в образе собраны под Linux, а на машине разработчика
      # под Windows: без этой строки хостовые накрыли бы линуксовые, и первый
      # же нативный модуль упал бы «invalid ELF header».
      #
      # .next — то же самое, но про артефакты: сборка с машины и сборка
      # в контейнере пишут в один каталог и портят друг другу кеш.
      - /app/node_modules
      - /app/.next

    environment:
      # В режиме разработки страницы собираются по запросу, поэтому каталог
      # читается из портала в тот же момент — адрес нужен внутренний,
      # как и в обычном режиме.
      VEDAL_API_INTERNAL_URL: http://portal:8081

      # Смотреть за файлами через bind mount из Windows Docker не умеет:
      # события файловой системы до контейнера не доходят, и правка молча
      # не подхватывается. Опрос решает это ценой небольшой нагрузки.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"

    # Здоровье меряется тем же запросом, но первый ответ в режиме разработки
    # приходит позже: страница собирается на первом обращении к ней.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s

    # Контейнер должен пережить перезапуск Docker и машины: смысл этого
    # наложения в том, что адрес http://localhost:3000 всегда рабочий.
    restart: unless-stopped
