# staging: предпросмотр изменений сайта, контента и интеграций форм.
#
# Отличается от прода не строгостью, а данными: сюда льются копии, а не боевая
# клиентская база. Подключение всё равно только из окружения — staging,
# подключившийся к прод-базе, это инцидент.
spring.datasource.url=${VEDAL_DB_URL}
spring.datasource.username=${VEDAL_DB_USER}
spring.datasource.password=${VEDAL_DB_PASSWORD}

# Владелец схемы — только для наката миграций; приложение работает под ролью,
# которая схему менять не может. Разбор — в application-prod.properties.
spring.flyway.user=${VEDAL_DB_MIGRATION_USER}
spring.flyway.password=${VEDAL_DB_MIGRATION_PASSWORD}

logging.structured.format.console=ecs
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate

vedal.notifications.portal-url=${VEDAL_PORTAL_URL}
vedal.storage.root=${VEDAL_STORAGE_ROOT}

# На staging письма наружу не уходят: адреса в копии данных настоящие.
# Пустой адрес означает «уведомление менеджеру не отправляется».
vedal.notifications.manager=

# Источники, которым разрешено ходить в публичные двери. Только из окружения:
# сайт, случайно оставшийся с localhost в списке, — дыра в периметре.
vedal.web.allowed-origins=${VEDAL_ALLOWED_ORIGINS}

# Спецификация OpenAPI и Swagger UI выключены: перечень дверей — карта системы,
# а здесь лежат настоящие данные. Контракт для интеграции берут из спецификации
# в dev или из репозитория, а не с боевого адреса.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
