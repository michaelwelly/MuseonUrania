# prod: публичный сайт, CRM, согласованные документы.
#
# Ключевое отличие от значений по умолчанию — подключение задаётся ТОЛЬКО
# окружением, без dev-значений. Плейсхолдер без default валит старт с понятной
# ошибкой, и это правильное поведение: прод, молча подключившийся к базе
# разработки, страшнее прода, который не поднялся.
spring.datasource.url=${VEDAL_DB_URL}
spring.datasource.username=${VEDAL_DB_USER}
spring.datasource.password=${VEDAL_DB_PASSWORD}

# Структурные логи в stdout: их собирает Yandex Cloud Logging.
logging.structured.format.console=ecs

# Восстановление базы командой из приложения не предусмотрено ни при каких
# обстоятельствах.
spring.flyway.clean-disabled=true

# Схему меняют только миграции. update на проде правит боевую базу молча
# и ломает воспроизводимость восстановления из бэкапа.
spring.jpa.hibernate.ddl-auto=validate

# Адрес портала в письмах менеджеру — только из окружения, localhost в письме
# бесполезен.
vedal.notifications.portal-url=${VEDAL_PORTAL_URL}

# Хранилище документов вне каталога приложения: деплой не должен уносить файлы.
vedal.storage.root=${VEDAL_STORAGE_ROOT}

# Источники, которым разрешено ходить в публичные двери. Только из окружения:
# сайт, случайно оставшийся с localhost в списке, — дыра в периметре.
vedal.web.allowed-origins=${VEDAL_ALLOWED_ORIGINS}

# Спецификация OpenAPI и Swagger UI выключены: перечень дверей — карта системы,
# а здесь лежат настоящие данные. Контракт для интеграции берут из спецификации
# в dev или из репозитория, а не с боевого адреса.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
