spring.application.name=portal

# 8080 на машине разработки занят чужим контейнером — не воюем за порт.
server.port=8081

# Плавная остановка. Без неё SIGTERM закрывает Tomcat немедленно: посетитель,
# отправлявший в этот момент заявку, получает обрыв соединения между записью
# в базу и ответом — и отправляет форму второй раз, уже с новым ключом
# идемпотентности. В CRM оказываются два одинаковых обращения.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# Наружу отдаём только health: список бинов, конфиг и env — это карта системы.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Пробы разнесены на живость и готовность. Это разные решения: не прошедший
# readiness контейнер снимается с балансировки, не прошедший liveness —
# перезапускается. Слить их значит перезапускать приложение из-за базы,
# недоступной одну секунду.
management.endpoint.health.probes.enabled=true
# Готовность учитывает базу: пока миграции не применились, принимать заявки
# нельзя. Живость её не учитывает намеренно — перезапуск приложения базу
# не чинит.
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState

# Спецификация OpenAPI и Swagger UI. По той же причине, что и с actuator:
# перечень дверей — карта системы, поэтому там, где лежат настоящие данные
# (prod, staging, internal), обе ручки выключены в профиле. Здесь значения
# для локальной разработки и lab.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# Ответ в разобранном виде: спецификацию читают глазами и кладут в git.
springdoc.writer-with-order-by-keys=true

# Приложение стоит за обратным прокси. Без этого лимит частоты считает всех
# посетителей одним клиентом, а аудит пишет адрес прокси вместо адреса
# пользователя. Список доверенных прокси задаётся при развёртывании.
server.forward-headers-strategy=framework

# Как события покидают outbox: log, kafka или debezium.
#
# log      — событие уходит в лог, потребители работают в процессе.
#            Брокер не нужен, чтобы приложение работало. Значение по умолчанию.
# kafka    — relay читает outbox по расписанию и публикует сам.
# debezium — outbox читает коннектор по журналу предзаписи PostgreSQL,
#            приложение забирает события из топиков. Таблицу никто не
#            опрашивает, и задержка перестаёт зависеть от периода опроса.
#            Требует wal_level=logical на базе и запущенного Kafka Connect.
vedal.events.publisher=${VEDAL_EVENTS_PUBLISHER:log}
spring.kafka.bootstrap-servers=${VEDAL_KAFKA:localhost:9092}
vedal.events.group-id=${VEDAL_EVENTS_GROUP:vedal-portal}

# С начала топика, а не с конца: потребитель, поднявшийся впервые или после
# долгого простоя, обязан разобрать накопившееся, а не сделать вид, что его
# не было. Повторы отсекаются по (потребитель, событие), поэтому разбор
# с начала безопасен.
spring.kafka.consumer.auto-offset-reset=earliest
# Подтверждение смещения после успешного разбора, а не по расписанию:
# автокоммит отметил бы событие разобранным до того, как потребитель
# закончил работу, и падение посередине потеряло бы его.
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

# Значения по умолчанию — локальная разработка, они же в compose.yaml.
# Прод и staging переопределяют переменными окружения: литеральный пароль
# в репозитории убирается только перезаписью истории.
spring.datasource.url=${VEDAL_DB_URL:jdbc:postgresql://localhost:5434/vedal}
spring.datasource.username=${VEDAL_DB_USER:vedal}
spring.datasource.password=${VEDAL_DB_PASSWORD:vedal}

# Схему ведёт Flyway. ddl-auto=update молча правит прод и ломает
# воспроизводимость восстановления из бэкапа.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Пул соединений. Значение по умолчанию — десять, и оно тесновато для стека,
# где одновременно работают сборка сайта, публичное API, админка и потребитель
# событий. Тайм-аут ожидания намеренно короткий: лучше быстрый отказ с понятной
# причиной, чем запрос, висящий полминуты и добивающий очередь.
spring.datasource.hikari.maximum-pool-size=${VEDAL_DB_POOL:16}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.leak-detection-threshold=30000

# Как портал проверяет вход в админское API: keycloak или local.
#
# keycloak — боевой режим: пароли, MFA и выдача токенов живут в Keycloak,
#   портал только проверяет подпись и разбирает роли realm_access.roles.
# local — запасной: HTTP Basic поверх учётных записей в таблице admin_user.
#   Режим разработки и режим «провайдера идентичности ещё нет».
#
# Правила доступа у обоих режимов одни и те же — см. SecurityConfig.
vedal.iam.mode=${VEDAL_IAM_MODE:local}
vedal.iam.client-id=${VEDAL_IAM_CLIENT_ID:vedal-portal}
# Адрес realm'а. Портал сам читает по нему конфигурацию OIDC и забирает ключи
# подписи. Нужен только в режиме keycloak.
vedal.iam.issuer=${VEDAL_OIDC_ISSUER:}
# Откуда забирать ключи подписи, если внешний адрес издателя порталу
# недоступен: в docker-сети и в закрытом контуре так и есть. Пусто — адрес
# ключей берётся из конфигурации OIDC по адресу издателя, и это правильный
# вариант, когда адрес один.
vedal.iam.jwks-uri=${VEDAL_OIDC_JWKS:}
# Кого токен должен называть получателем. Пусто — не проверяем: в Keycloak
# «из коробки» в aud лежит `account`, и требовать здесь имя клиента можно
# только настроив audience mapper на стороне realm'а.
vedal.iam.audience=${VEDAL_OIDC_AUDIENCE:}

# Справочник сотрудников: откуда портал берёт список ответственных.
#
# Читается административным API Keycloak от имени служебной учётной записи
# клиента. Секрет не задан — справочник берётся из таблицы admin_user, и это
# рабочее состояние, а не поломка: портал жил так до появления справочника.
#
# Прав служебной учётной записи нужно ровно одно — view-users. С manage-users
# утёкший секрет означает не «прочитали список сотрудников», а «завели себе
# учётную запись администратора».
# Клиент отдельный от vedal.iam.client-id: тот bearer-only и токенов не берёт —
# он только проверяет чужие. Проверяющий токены и ходящий за списком — разные
# роли, и клиенты у них разные.
vedal.iam.service-client-id=${VEDAL_OIDC_SVC_CLIENT_ID:vedal-portal-svc}
vedal.iam.service-client-secret=${VEDAL_OIDC_SVC_CLIENT_SECRET:}

# Realm и внутренний адрес Keycloak. Адрес нужен отдельно от издателя по той
# же причине, что и JWKS: в токене стоит внешний адрес, по которому за токеном
# ходил браузер, а из docker-сети он не резолвится.
vedal.iam.realm=${VEDAL_OIDC_REALM:vedal}
vedal.iam.admin-url=${VEDAL_OIDC_ADMIN_URL:}

# Первый администратор создаётся только если обе переменные заданы.
# Пароль в репозиторий не попадает. В режиме keycloak учётные записи заводятся
# там, и эти переменные не нужны.
vedal.admin.username=${VEDAL_ADMIN_USER:}
vedal.admin.password=${VEDAL_ADMIN_PASSWORD:}

# Версия текста согласия на обработку персональных данных. Меняется вместе
# с самим текстом на сайте: в заявке хранится версия, а не галочка.
vedal.consent.version=2026-08-09

# Откуда сайту разрешено ходить в публичные двери. Через запятую, схема и порт
# обязательны — это Origin, а не домен. По умолчанию адрес `next dev`.
vedal.web.allowed-origins=${VEDAL_ALLOWED_ORIGINS:http://localhost:3000}

# Лимиты частоты по адресу клиента, у каждой публичной двери свой бюджет.
vedal.forms.rate-limit.count=5
vedal.forms.rate-limit.window=PT10M
vedal.assistant.rate-limit.count=20
vedal.assistant.rate-limit.window=PT10M

# Контакты для передачи человеку. Реквизиты с бланка датащитов,
# см. docs/products/README.md — не выдуманные значения.
vedal.contacts.phone=8 800 600 3449
vedal.contacts.email=sales@vedal-med.ru

# Ответственный за заявки. Адрес с бланка датащитов, см. docs/products/README.md.
# Пустое значение = уведомление менеджеру не отправляется; чужую почту
# по умолчанию не подставляем.
vedal.notifications.manager=sales@vedal-med.ru
# Адрес портала в письме менеджеру. На проде переопределяется окружением.
vedal.notifications.portal-url=${VEDAL_PORTAL_URL:http://localhost:8081}
vedal.notifications.max-attempts=5

# Объектное хранилище. local — каталог на диске, режим вёрстки без Docker.
# s3 — MinIO локально и Yandex Object Storage в облаке: протокол один,
# различаются адрес, ключи и имена бакетов.
vedal.storage.kind=${VEDAL_STORAGE_KIND:local}
vedal.storage.root=${VEDAL_STORAGE_ROOT:./var/documents}

# Предел на один файл. Двадцать мегабайт — рабочий размер датащита
# с иллюстрациями. Это же число ниже в multipart, в лимите тела API Gateway
# и в client_max_body_size на прокси: меньшее значение выше по цепочке роняет
# загрузку с 413 до приложения, и редактор видит страницу прокси вместо
# внятного отказа.
vedal.storage.max-file-size=20MB

vedal.storage.s3.endpoint=${VEDAL_S3_ENDPOINT:http://localhost:9000}
vedal.storage.s3.region=${VEDAL_S3_REGION:ru-central1}
vedal.storage.s3.access-key=${VEDAL_S3_ACCESS_KEY:}
vedal.storage.s3.secret-key=${VEDAL_S3_SECRET_KEY:}
vedal.storage.s3.path-style=true
vedal.storage.s3.buckets.documents=${VEDAL_S3_BUCKET_DOCUMENTS:vedal-documents}
vedal.storage.s3.buckets.media=${VEDAL_S3_BUCKET_MEDIA:vedal-media}

# Разбор multipart обрывает чтение на превышении, не доводя тело до кучи —
# это и есть настоящая защита от большого файла, а проверка в хранилище
# вторая линия. Запас на request сверх file — поля формы, которые едут
# в том же теле.
spring.servlet.multipart.max-file-size=${vedal.storage.max-file-size}
spring.servlet.multipart.max-request-size=21MB
# Свыше мегабайта содержимое уходит во временный файл, а не остаётся в куче:
# иначе десять параллельных загрузок по 20 МБ — это 200 МБ heap.
spring.servlet.multipart.file-size-threshold=1MB
