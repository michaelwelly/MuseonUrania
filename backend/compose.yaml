services:
  db:
    image: postgres:16
    container_name: vedal-db
    environment:
      POSTGRES_DB: vedal
      POSTGRES_USER: vedal
      POSTGRES_PASSWORD: vedal
    ports:
      - "5434:5432"
    volumes:
      - vedal-db:/var/lib/postgresql/data

  # Шаг 6 порядка реализации из спеки. Пока EventPublisher пишет в лог,
  # брокер не нужен для работы приложения — он нужен, чтобы этот шаг можно
  # было начать, не собирая окружение с нуля.
  #
  # KRaft, без ZooKeeper: один брокер он же контроллер. Для разработки этого
  # достаточно, в облаке будет Managed Kafka.
  kafka:
    image: apache/kafka:3.9.0
    container_name: vedal-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # Один брокер — реплик быть не может.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Топики заводятся миграцией конфигурации, а не первым обращением:
      # опечатка в имени не должна создавать новый топик молча.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - vedal-kafka:/var/lib/kafka/data

  # Объектное хранилище. В облаке будет Yandex Object Storage, локально —
  # MinIO: он говорит на том же протоколе S3, поэтому переезд меняет адрес
  # и ключи, а не код. По той же причине клиент в приложении — AWS SDK,
  # а не родная библиотека MinIO: с ней переезд означал бы переписать клиент.
  #
  # Два бакета, и это не удобство раскладки, а требование:
  #   vedal-documents — приватный. Файл отдаётся только через контроллер,
  #     который проверяет статус публикации и пишет обращение в журнал.
  #     Прямой доступ к бакету означал бы выдачу закрытого документа мимо
  #     проверки и мимо аудита.
  #   vedal-media — публичный на чтение. Фото изделий и изображения новостей:
  #     их и так видно на сайте, а гонять картинки через приложение — значит
  #     класть на него трафик, который должен идти в CDN.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: vedal-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: vedal
      MINIO_ROOT_PASSWORD: vedal-local-secret
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - vedal-minio:/data

  # Бакеты заводятся здесь, а не первым обращением приложения: приложение,
  # умеющее создавать бакеты, умеет создать и лишний — от опечатки в имени.
  # Контейнер одноразовый, отрабатывает и гаснет.
  #
  # Политика медиа задаётся явным JSON, а не готовым `mc anonymous set download`:
  # тот вместе с чтением объектов открывает и перечисление бакета, то есть
  # отдаёт всем список ключей — включая снимки, загруженные до анонса. Здесь
  # разрешено ровно s3:GetObject: файл по известной ссылке отдаётся, каталог
  # содержимого — нет.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: vedal-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 vedal vedal-local-secret
        mc mb --ignore-existing local/vedal-documents
        mc mb --ignore-existing local/vedal-media
        mc anonymous set none local/vedal-documents
        cat > /tmp/media-policy.json <<'JSON'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": { "AWS": ["*"] },
              "Action": ["s3:GetObject"],
              "Resource": ["arn:aws:s3:::vedal-media/*"]
            }
          ]
        }
        JSON
        mc anonymous set-json /tmp/media-policy.json local/vedal-media
        echo 'бакеты готовы: vedal-documents закрыт, vedal-media отдаёт объекты без перечисления'

volumes:
  vedal-db:
  vedal-kafka:
  vedal-minio:
