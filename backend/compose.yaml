services:
  db:
    image: postgres:16
    container_name: vedal-db
    environment:
      POSTGRES_DB: vedal
      POSTGRES_USER: vedal
      POSTGRES_PASSWORD: vedal
    ports:
      - "5434:5432"
    volumes:
      - vedal-db:/var/lib/postgresql/data

  # Шаг 6 порядка реализации из спеки. Пока EventPublisher пишет в лог,
  # брокер не нужен для работы приложения — он нужен, чтобы этот шаг можно
  # было начать, не собирая окружение с нуля.
  #
  # KRaft, без ZooKeeper: один брокер он же контроллер. Для разработки этого
  # достаточно, в облаке будет Managed Kafka.
  kafka:
    image: apache/kafka:3.9.0
    container_name: vedal-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # Один брокер — реплик быть не может.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Топики заводятся миграцией конфигурации, а не первым обращением:
      # опечатка в имени не должна создавать новый топик молча.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - vedal-kafka:/var/lib/kafka/data

volumes:
  vedal-db:
  vedal-kafka:
