spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          # Проставлять `X-Forwarded-*` порталу. Без этого он видит адрес
          # шлюза вместо адреса посетителя: журнал пишет один контейнерный
          # адрес на всех, а лимит частоты считает весь мир одним клиентом.
          #
          # Значение выглядит опасным и не является им. Для шлюза это не
          # «верить всякому заголовку», а «вообще заниматься этими
          # заголовками»: одной настройкой здесь заведуют обе вещи сразу,
          # и без неё заголовок не добавляется, а вырезается. Доверие
          # решается раньше и отдельно — в ClientAddress: всё, что запрос
          # рассказал о себе сам, вычищается до маршрутизации, и адрес
          # ставится по соединению.
          trusted-proxies: ".*"

          # Порядок маршрутов важен: /api/admin/** подходит и под /api/**.
          # Список разбирается сверху вниз, поэтому частное идёт первым.
          routes:
            # Двери правки. Токен проверяется ещё и здесь, на периметре, —
            # см. GatewaySecurityConfig. Портал проверит его повторно.
            - id: portal-admin-api
              uri: ${VEDAL_PORTAL_URL:http://localhost:8081}
              predicates:
                - Path=/api/admin/**
              filters:
                # Двадцать мегабайт на файл плюс запас на поля формы.
                # Значение согласовано с vedal.storage.max-file-size портала:
                # меньший лимит здесь роняет загрузку с 413 до приложения,
                # и редактор видит страницу шлюза вместо внятного отказа.
                - name: RequestSize
                  args:
                    maxSize: 21MB

            # Публичные двери: каталог, новости, документы, формы, ассистент.
            - id: portal-public-api
              uri: ${VEDAL_PORTAL_URL:http://localhost:8081}
              predicates:
                - Path=/api/**

            # Спецификация и Swagger UI. Отдельным маршрутом, а не под /api/**:
            # springdoc обслуживает их вне этого префикса.
            - id: portal-openapi
              uri: ${VEDAL_PORTAL_URL:http://localhost:8081}
              predicates:
                - Path=/v3/api-docs/**,/v3/api-docs.yaml/**,/swagger-ui/**,/swagger-ui.html

            # Маршрута на серверные страницы админки здесь нет, потому что
            # их больше нет вовсе: у портала не осталось ни одной страницы
            # для браузера, и вместе с ними ушли форма входа, cookie-сессия
            # и CSRF-токен. Вход идёт в Keycloak напрямую.

            # Всё остальное — сайт, включая /admin/** на Next.js. Предикат
            # самый широкий, поэтому маршрут последний.
            - id: site
              uri: ${VEDAL_SITE_URL:http://localhost:3000}
              predicates:
                - Path=/**

vedal:
  gateway:
    # Проверять ли токен на периметре. false — шлюз пропускает Authorization
    # дальше не глядя, и решение принимает портал. Это рабочий режим, пока
    # Keycloak нет; порталу от этого не легче и не тяжелее — он проверяет
    # токен в любом случае.
    #
    # true — отказ приходит на границе, и запрос без токена не доходит
    # до приложения вовсе.
    verify-tokens: ${VEDAL_GATEWAY_VERIFY_TOKENS:false}
    oidc-issuer: ${VEDAL_OIDC_ISSUER:}

    # Адрес своего прокси перед шлюзом — выражением, целиком совпадающим
    # с адресом. Заданный, он один имеет право сказать шлюзу, кто пришёл;
    # у всех остальных заголовки о происхождении отбираются, см.
    # ClientAddress.
    #
    # Пусто — верное значение везде, где шлюз открыт наружу сам: на стенде
    # и на машине разработчика. В проде перед ним стоит Caddy, и сюда идёт
    # адрес его контейнера.
    trusted-proxy: ${VEDAL_GATEWAY_TRUSTED_PROXY:}

server:
  port: ${VEDAL_GATEWAY_PORT:8080}
  # Заголовкам о происхождении шлюз не верит: снаружи к нему приходят прямо
  # из интернета, а `framework` заставил бы Spring подменять адрес клиента
  # тем, что в запросе написано. Кто заслуживает доверия — решает
  # vedal.gateway.trusted-proxy ниже, и решает адресно.
  forward-headers-strategy: none

management:
  endpoints:
    web:
      exposure:
        # Только health: перечень маршрутов шлюза — карта системы.
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.cloud.gateway: INFO
