spring.application.name=portal

# 8080 на машине разработки занят чужим контейнером — не воюем за порт.
server.port=8081

# Наружу отдаём только health: список бинов, конфиг и env — это карта системы.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Спецификация OpenAPI и Swagger UI. По той же причине, что и с actuator:
# перечень дверей — карта системы, поэтому там, где лежат настоящие данные
# (prod, staging, internal), обе ручки выключены в профиле. Здесь значения
# для локальной разработки и lab.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# Ответ в разобранном виде: спецификацию читают глазами и кладут в git.
springdoc.writer-with-order-by-keys=true

# Приложение стоит за обратным прокси. Без этого лимит частоты считает всех
# посетителей одним клиентом, а аудит пишет адрес прокси вместо адреса
# пользователя. Список доверенных прокси задаётся при развёртывании.
server.forward-headers-strategy=framework

# Куда relay публикует события из outbox: log или kafka.
# По умолчанию log — брокер не нужен, чтобы приложение работало.
vedal.events.publisher=${VEDAL_EVENTS_PUBLISHER:log}
spring.kafka.bootstrap-servers=${VEDAL_KAFKA:localhost:9092}

# Значения по умолчанию — локальная разработка, они же в compose.yaml.
# Прод и staging переопределяют переменными окружения: литеральный пароль
# в репозитории убирается только перезаписью истории.
spring.datasource.url=${VEDAL_DB_URL:jdbc:postgresql://localhost:5434/vedal}
spring.datasource.username=${VEDAL_DB_USER:vedal}
spring.datasource.password=${VEDAL_DB_PASSWORD:vedal}

# Схему ведёт Flyway. ddl-auto=update молча правит прод и ломает
# воспроизводимость восстановления из бэкапа.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Первый администратор создаётся только если обе переменные заданы.
# Пароль в репозиторий не попадает.
vedal.admin.username=${VEDAL_ADMIN_USER:}
vedal.admin.password=${VEDAL_ADMIN_PASSWORD:}

# Версия текста согласия на обработку персональных данных. Меняется вместе
# с самим текстом на сайте: в заявке хранится версия, а не галочка.
vedal.consent.version=2026-08-09

# Откуда сайту разрешено ходить в публичные двери. Через запятую, схема и порт
# обязательны — это Origin, а не домен. По умолчанию адрес `next dev`.
vedal.web.allowed-origins=${VEDAL_ALLOWED_ORIGINS:http://localhost:3000}

# Лимиты частоты по адресу клиента, у каждой публичной двери свой бюджет.
vedal.forms.rate-limit.count=5
vedal.forms.rate-limit.window=PT10M
vedal.assistant.rate-limit.count=20
vedal.assistant.rate-limit.window=PT10M

# Контакты для передачи человеку. Реквизиты с бланка датащитов,
# см. docs/products/README.md — не выдуманные значения.
vedal.contacts.phone=8 800 600 3449
vedal.contacts.email=sales@vedal-med.ru

# Ответственный за заявки. Адрес с бланка датащитов, см. docs/products/README.md.
# Пустое значение = уведомление менеджеру не отправляется; чужую почту
# по умолчанию не подставляем.
vedal.notifications.manager=sales@vedal-med.ru
# Адрес портала в письме менеджеру. На проде переопределяется окружением.
vedal.notifications.portal-url=${VEDAL_PORTAL_URL:http://localhost:8081}
vedal.notifications.max-attempts=5

# Объектное хранилище ещё не выбрано (ADR ждёт решения по Yandex Cloud):
# файлы лежат в локальном каталоге. Каталог наружу не раздаётся — файл
# отдаётся только через контроллер, который проверяет статус публикации.
vedal.storage.root=${VEDAL_STORAGE_ROOT:./var/documents}

# Ограничение согласуется с лимитом тела на прокси, иначе PDF падает с 413
# до приложения.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
