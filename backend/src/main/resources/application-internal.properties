# internal: закрытая часть портала — документы и внутренние инструменты.
#
# Публичные двери здесь не нужны, но отключать их конфигурацией нельзя:
# периметр закрывается на прокси, а не в приложении. Из брифа: VPN — периметр,
# а не авторизация; вход, роли и аудит нужны независимо от того, закрыт ли
# контур по сети.
spring.datasource.url=${VEDAL_DB_URL}
spring.datasource.username=${VEDAL_DB_USER}
spring.datasource.password=${VEDAL_DB_PASSWORD}

logging.structured.format.console=ecs
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate

vedal.notifications.portal-url=${VEDAL_PORTAL_URL}
vedal.storage.root=${VEDAL_STORAGE_ROOT}
