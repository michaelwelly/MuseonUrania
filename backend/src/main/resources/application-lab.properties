# lab: эксперименты с моделями. Из спеки — только несекретные данные.
#
# Письма наружу не уходят никогда: в lab попадают синтетические или
# обезличенные записи, но проверять это на каждом наборе никто не будет,
# поэтому отправка отключена конфигурацией, а не дисциплиной.
spring.datasource.url=${VEDAL_DB_URL}
spring.datasource.username=${VEDAL_DB_USER}
spring.datasource.password=${VEDAL_DB_PASSWORD}

logging.structured.format.console=ecs
spring.jpa.hibernate.ddl-auto=validate

vedal.notifications.manager=
vedal.notifications.portal-url=${VEDAL_PORTAL_URL:http://localhost:8081}
vedal.storage.root=${VEDAL_STORAGE_ROOT:./var/documents-lab}

# clean не запрещаем: базу lab штатно пересобирают под новый набор данных.
spring.flyway.clean-disabled=false

# В lab фронтенд ходит с машины разработчика.
vedal.web.allowed-origins=${VEDAL_ALLOWED_ORIGINS:http://localhost:3000}
