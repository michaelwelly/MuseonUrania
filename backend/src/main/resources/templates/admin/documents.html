<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="utf-8">
    <title>Документы — админка VEDAL</title>
    <style>
        body { font: 15px/1.5 system-ui, sans-serif; margin: 32px; color: #12202a; }
        table { border-collapse: collapse; width: 100%; margin-top: 16px; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #dde5e2; vertical-align: middle; }
        .off { color: #5e6b73; }
        .msg { padding: 10px 12px; background: #eef6f1; border-left: 3px solid #2f7a52; margin-top: 16px; }
        .err { padding: 10px 12px; background: #fbeeee; border-left: 3px solid #a03a3a; margin-top: 16px; }
        button { font: inherit; padding: 6px 12px; cursor: pointer; }
        nav a { margin-right: 16px; }
        form.inline { display: inline; }
        input[type=file] { font: inherit; max-width: 200px; }
    </style>
</head>
<body>
<h1>Документы и лицензирование</h1>
<nav>
    <a th:href="@{/admin/products}">Каталог</a>
    <a th:href="@{/admin/news}">Новости</a>
    <a th:href="@{/admin/leads}">Заявки</a>
</nav>

<p class="msg" th:if="${message}" th:text="${message}">—</p>
<p class="err" th:if="${error}" th:text="${error}">—</p>

<table>
    <tr>
        <th>Документ</th><th>Раздел</th><th>Относится к</th>
        <th>Чувствительность</th><th>Доступ</th><th>Файл</th><th>На сайте</th><th></th>
    </tr>
    <tr th:each="d : ${documents}">
        <td th:text="${d.title}">—</td>
        <td th:text="${d.docGroup}">—</td>
        <td th:text="${d.subject}">—</td>
        <td th:text="${d.sensitivity}">—</td>
        <td th:text="${d.access}">—</td>
        <td>
            <span th:if="${d.storageKey}" th:text="${d.fileSize} + ' Б'">—</span>
            <form class="inline" th:action="@{/admin/documents/{id}/upload(id=${d.id})}"
                  method="post" enctype="multipart/form-data">
                <input type="file" name="file" required>
                <button type="submit">Загрузить</button>
            </form>
        </td>
        <td th:text="${d.published} ? 'да' : 'нет'" th:classappend="${d.published} ? '' : 'off'">—</td>
        <td>
            <form th:action="@{/admin/documents/{id}/publish(id=${d.id})}" method="post">
                <button type="submit" th:text="${d.published} ? 'Снять с сайта' : 'Опубликовать'">—</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
