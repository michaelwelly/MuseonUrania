<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="utf-8">
    <title>Новости — админка VEDAL</title>
    <style>
        body { font: 15px/1.5 system-ui, sans-serif; margin: 32px; color: #12202a; }
        table { border-collapse: collapse; width: 100%; margin-top: 16px; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #dde5e2; }
        .off { color: #5e6b73; }
        .empty { margin-top: 24px; color: #5e6b73; }
        button { font: inherit; padding: 6px 12px; cursor: pointer; }
        nav a { margin-right: 16px; }
    </style>
</head>
<body>
<h1>Новости и пресс-центр</h1>
<nav>
    <a th:href="@{/admin/products}">Каталог</a>
    <a th:href="@{/admin/leads}">Заявки</a>
    <a th:href="@{/admin/news/new}">Добавить публикацию</a>
</nav>

<p class="empty" th:if="${#lists.isEmpty(news)}">
    Публикаций пока нет. Первой планируется релиз по Иннопрому — материалы ожидают передачи.
</p>

<table th:unless="${#lists.isEmpty(news)}">
    <tr><th>Заголовок</th><th>Раздел</th><th>Дата</th><th>На сайте</th><th></th></tr>
    <tr th:each="n : ${news}">
        <td><a th:href="@{/admin/news/{id}(id=${n.id})}" th:text="${n.title}">—</a></td>
        <td th:text="${n.tag}">—</td>
        <td th:text="${n.publishedOn} ?: '—'">—</td>
        <td th:text="${n.published} ? 'да' : 'нет'" th:classappend="${n.published} ? '' : 'off'">—</td>
        <td>
            <form th:action="@{/admin/news/{id}/publish(id=${n.id})}" method="post">
                <button type="submit" th:text="${n.published} ? 'Снять с сайта' : 'Опубликовать'">—</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
