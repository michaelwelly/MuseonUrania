<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="utf-8">
    <title>Публикация — админка VEDAL</title>
    <style>
        body { font: 15px/1.5 system-ui, sans-serif; margin: 32px; color: #12202a; }
        label { display: block; margin-top: 16px; font-weight: 600; }
        input, textarea, select { font: inherit; width: 100%; max-width: 640px; padding: 8px; }
        textarea { height: 140px; }
        button { font: inherit; margin-top: 20px; padding: 8px 16px; cursor: pointer; }
        .hint { font-weight: 400; color: #5e6b73; font-size: 13px; }
    </style>
</head>
<body>
<h1 th:text="${creating} ? 'Новая публикация' : ${item.title}">Публикация</h1>

<form th:action="${creating} ? @{/admin/news} : @{/admin/news/{id}(id=${item.id})}" method="post">
    <label th:if="${creating}">Слаг <span class="hint">латиница, цифры и дефис — попадает в адрес страницы</span>
        <input name="slug" required pattern="[a-z0-9][a-z0-9-]*">
    </label>

    <label>Раздел
        <select name="tag">
            <option th:each="t : ${tags}" th:value="${t}" th:text="${t}"
                    th:selected="${item.tag == t}">—</option>
        </select>
    </label>

    <label>Заголовок<input name="title" th:value="${item.title}" required></label>
    <label>Короткий текст для ленты<textarea name="excerpt" th:text="${item.excerpt}" required></textarea></label>
    <label>Полный текст<textarea name="body" th:text="${item.body}"></textarea></label>

    <label>Дата публикации <span class="hint">без неё материал нельзя вывести на сайт</span>
        <input name="publishedOn" type="date" th:value="${item.publishedOn}">
    </label>

    <button type="submit">Сохранить</button>
</form>

<p><a th:href="@{/admin/news}">К списку</a></p>
</body>
</html>
