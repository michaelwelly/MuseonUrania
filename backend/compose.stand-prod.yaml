# Stand-production overlay for the shared VM.
#
# Purpose:
# - keep C3AG/Astor 80/443 untouched;
# - expose VEDAL by IP on :18080 until vedal-med.ru DNS is available;
# - use real Yandex Object Storage instead of local MinIO;
# - publish Keycloak on :18180 so employees can actually sign in.
#
# ————— почему Keycloak пришлось открыть —————
#
# Здесь было написано «keep Keycloak on localhost for now», и вместе
# с этим сайту передавался NEXT_PUBLIC_OIDC_ISSUER со значением
# http://localhost:8180/realms/vedal. Этот адрес живёт В БРАУЗЕРЕ
# СОТРУДНИКА, то есть указывает на его собственную машину. Войти мог бы
# только тот, кто открыл браузер на самой ВМ. Вход не был сломан —
# его не было.

services:

  # Заливка фотографий из репозитория. Единственное, что связывает
  # frontend/public/photos с бакетом, — но запускается только по просьбе
  # (профиль seed): она пишет туда, откуда читает живой сайт.
  #
  # Что было. Сервис стоял в профиле local-minio, то есть на ВМ не запускался
  # вовсе. Файл, добавленный в репозиторий, в бакет не попадал, и каталог
  # показывал изделия без фотографий: vedal-r1.jpg, vedal-r2.jpg,
  # hall-booklet.jpg и service-r2-setup.jpg отдавали 404. Сборку это не роняет
  # и тестами не ловится — 404 за картинкой видно только глазами на стенде.
  #
  media-seed:
    environment:
      S3_ACCESS_KEY: ${VEDAL_S3_ACCESS_KEY:?set VEDAL_S3_ACCESS_KEY}
      S3_SECRET_KEY: ${VEDAL_S3_SECRET_KEY:?set VEDAL_S3_SECRET_KEY}
      S3_ENDPOINT: ${VEDAL_S3_ENDPOINT:?set VEDAL_S3_ENDPOINT}
      S3_BUCKET_MEDIA: ${VEDAL_S3_BUCKET_MEDIA:-vedal-media}

  portal:
    depends_on: !override
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      VEDAL_STORAGE_KIND: s3
      VEDAL_S3_ENDPOINT: ${VEDAL_S3_ENDPOINT:?set VEDAL_S3_ENDPOINT}
      VEDAL_S3_REGION: ${VEDAL_S3_REGION:-ru-central1}
      VEDAL_S3_BUCKET_MEDIA: ${VEDAL_S3_BUCKET_MEDIA:-vedal-media}
      VEDAL_S3_BUCKET_DOCUMENTS: ${VEDAL_S3_BUCKET_DOCUMENTS:-vedal-documents}
      VEDAL_S3_ACCESS_KEY: ${VEDAL_S3_ACCESS_KEY:?set VEDAL_S3_ACCESS_KEY}
      VEDAL_S3_SECRET_KEY: ${VEDAL_S3_SECRET_KEY:?set VEDAL_S3_SECRET_KEY}

  # ————— вход сотрудников —————
  #
  # На машине 80 и 443 держит чужой боевой сайт, домена vedal-med.ru ещё
  # нет, и до перевода домена вход открывается по адресу с портом,
  # БЕЗ ШИФРОВАНИЯ. Это решение заказчика, принятое с открытыми глазами,
  # и цена у него прямая: пароль сотрудника идёт по интернету открытым
  # текстом, а за этим паролем стоит клиентская база.
  #
  # Чем это чинится: TLS. Либо владелец ВМ заводит на своём 443 имена
  # для портала и для Keycloak, либо переводится домен и поднимается
  # прод-профиль с Caddy. Оба пути отменяют этот блок целиком.
  keycloak:
    ports: !override
      - "0.0.0.0:${VEDAL_KEYCLOAK_HOST_PORT:-18180}:8080"
    environment:
      # Внешний адрес, по которому Keycloak видит браузер сотрудника.
      # Он же уезжает в NEXT_PUBLIC_OIDC_ISSUER ниже: адрес выдающего
      # токены обязан совпадать с адресом, по которому за ними приходят,
      # иначе портал отвергает токен по issuer.
      KC_HOSTNAME: ${VEDAL_KEYCLOAK_URL:?set VEDAL_KEYCLOAK_URL, например http://51.250.31.97:18180}
      # KC_PROXY_HEADERS здесь НЕ переопределяется: остаётся xforwarded
      # из прод-профиля. Это осознанный компромисс, и вот его разбор.
      #
      # Как правильно. Заголовки X-Forwarded-* разрешено слушать только
      # за своим прокси. Здесь прокси нет, Keycloak смотрит прямо
      # в интернет, и трогать их незачем.
      #
      # Почему всё-таки остаётся. Значения «не слушать» у этой опции нет —
      # она либо forwarded, либо xforwarded, либо не задана вовсе. Убрать
      # унаследованный ключ из наложенного файла нечем: !reset у переменных
      # окружения не удаляет ключ, а откатывает к значению предыдущего файла
      # (проверено docker compose config, версия v5.3.1).
      #
      # Чем это грозит и чем не грозит. Адрес в ссылках входа подменить
      # нельзя: KC_HOSTNAME задан явно и берётся оттуда, а не из заголовков.
      # Остаётся одно — клиент может подставить чужой X-Forwarded-For
      # и тем сбить счётчик защиты от перебора паролей. На фоне того, что
      # сам пароль на этом стенде идёт открытым текстом, это меньшая беда,
      # и снимается она тем же самым: TLS перед Keycloak.
      #
      # ЦЕНА ОШИБКИ ЗДЕСЬ ВЫСОКА, и я её уже заплатил. Сначала тут стояло
      # KC_PROXY_HEADERS: "" — Keycloak 26 такое значение не принимает:
      #
      #   Invalid value for option 'KC_PROXY_HEADERS': .
      #   Expected values are: forwarded, xforwarded
      #
      # Контейнер падал на старте и здоровым не становился никогда, а портал
      # ниже ждёт его через depends_on: service_healthy — и не поднимался
      # вместе со шлюзом и сайтом. Снаружи это выглядело как «выкатили —
      # и всё исчезло»: порт перестал принимать соединения вообще.
    volumes: !override
      # Свой realm, не прод-овский. Отличие ровно одно и оно вынужденное:
      # sslRequired: none. Прод-realm со значением all отказался бы отдать
      # страницу входа по HTTP вообще — не предупредил, а отказал.
      #
      # Отдельный файл, а не правка прод-realm'а: послабление обязано
      # жить там же, где временный обходной путь, и исчезнуть вместе
      # с ним. Второй фактор, защита от перебора и политика паролей
      # здесь те же, что в проде.
      - ./keycloak/stand:/opt/keycloak/data/import:ro
      - vedal-keycloak:/opt/keycloak/data

  api-gateway:
    ports: !override
      - "0.0.0.0:${VEDAL_GATEWAY_HOST_PORT:-18080}:8080"

  site:
    environment:
      NEXT_PUBLIC_API_URL: ${VEDAL_PUBLIC_URL:?set VEDAL_PUBLIC_URL}
      NEXT_PUBLIC_MEDIA_URL: ${VEDAL_MEDIA_URL:?set VEDAL_MEDIA_URL}
      # Без значения по умолчанию: молчаливый localhost здесь и был причиной
      # того, что вход не работал ни у кого, кроме сидящего за самой ВМ.
      # Пусть развёртывание падает на отсутствующей переменной, а не выдаёт
      # сотруднику страницу, которая никуда не ведёт.
      NEXT_PUBLIC_OIDC_ISSUER: ${VEDAL_KEYCLOAK_URL:?set VEDAL_KEYCLOAK_URL, например http://51.250.31.97:18180}/realms/vedal
