        imageSrc:
          type:
          - string
          - "null"
          description: "Путь к фотографии на сайте. `null`, если фотографии нет."
          example: /photos/products/vedal-r1-r2.jpg
        kind:
          type: string
          description: Тип изделия одной строкой.
          example: Системы реанимационные для новорождённых
        name:
          type: string
          description: Название изделия.
          example: "VEDAL R1, R2"
        slug:
          type: string
          description: Идентификатор в URL.
          example: vedal-r1-r2
        summary:
          type: string
          description: Краткое описание для списка.
    ProductDetail:
      type: object
      description: Карточка изделия целиком.
      properties:
        categories:
          type: array
          description: "Названия категорий, к которым отнесено изделие."
          items:
            type: string
        detail:
          type:
          - string
          - "null"
          description: "Развёрнутое описание. `null`, если его ещё не написали."
        docStatus:
          type: string
          description: Состояние регистрационных документов.
          enum:
          - confirmed
          - pending
          example: confirmed
        imageAlt:
          type:
          - string
          - "null"
          description: Подпись к фотографии.
        imageSrc:
          type:
          - string
          - "null"
          description: Путь к фотографии на сайте.
        keyParams:
          type: array
          description: Ключевые параметры — короткий блок наверху карточки.
          items:
            $ref: "#/components/schemas/Spec"
        kind:
          type: string
          description: Тип изделия одной строкой.
          example: Системы реанимационные для новорождённых
        name:
          type: string
          description: Название изделия.
          example: "VEDAL R1, R2"
        slug:
          type: string
          description: Идентификатор в URL.
          example: vedal-r1-r2
        specs:
          type: array
          description: Полная таблица характеристик.
          items:
            $ref: "#/components/schemas/Spec"
        summary:
          type: string
          description: Краткое описание для списка.
    Source:
      type: object
      description: "Опубликованный материал, на который опирается ответ."
      properties:
        kind:
          type: string
          description: Откуда материал взят.
          enum:
          - product
          - news
          - document
          example: product
        title:
          type: string
          description: Название материала. У изделия — название и тип через тире.
          example: VEDAL A-2000 — Инкубатор-трансформер
        url:
          type: string
          description: Адрес материала на сайте.
          example: /products/vedal-a-2000/
    Spec:
      type: object
      description: "Строка характеристики: подпись и значение."
      properties:
        label:
          type: string
          description: Подпись строки.
          example: Габариты R1
        muted:
          type: boolean
          description: "Значение приглушается в вёрстке: ориентировочное или ожида\
            ющее подтверждения. Отдаётся всегда, в том числе false."
        value:
          type: string
          description: "Значение как его показывает сайт, вместе с единицами."
          example: 1185 × 740 × 1840 мм
    SseEmitter:
      type: object
      properties:
        timeout:
          type: integer
          format: int64
    Thread:
      type: object
      properties:
        id:
          type: string
          format: uuid
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Line"
        status:
          type: string
  securitySchemes:
    keycloak:
      bearerFormat: JWT
      description: |
        Токен доступа из Keycloak. Роли портала — `portal-admin`
        и `portal-editor` в `realm_access.roles`; токен без них
        проходит проверку подписи и получает `403`.

        В режиме `vedal.iam.mode=local` вместо этого работает
        HTTP Basic поверх учётных записей портала — режим
        разработки, не контракт.
      scheme: bearer
      type: http
