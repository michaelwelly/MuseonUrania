openapi: 3.1.0
info:
  contact:
    email: sales@vedal-med.ru
    name: VEDAL
    url: tel:88006003449
  description: |
    Контракт сайта vedal-med.ru с серверной частью портала.

    Двери и их правила:

    - `/api/public/v1/**` — чтение опубликованного. Ответы кэшируются
      на пять минут (`Cache-Control: max-age=300, public`); файлы
      документов не кэшируются вовсе, потому что снятая с публикации
      редакция не должна жить в кэшах прокси.
    - `/api/forms/v1/**` — приём заявок. Отвечает `202 Accepted`:
      заявка принята, дальше её разбирает менеджер.
    - `/api/assistant/v1/**` — вопрос ассистенту.

    Ошибки во всех дверях — `application/problem+json` по RFC 9457.
    Разбор по полям формы приезжает в расширении `fields`.

    Кросс-доменные запросы разрешены только источникам из
    `vedal.web.allowed-origins`, без передачи учётных данных: у
    публичных дверей нет ни cookie, ни сессии. Повторную отправку
    заявки различает заголовок `Idempotency-Key`, а не пользователь.

    Лимит частоты считается по адресу клиента, у каждой двери свой
    бюджет: формы — 5 обращений за 10 минут, ассистент — 20.
    Превышение отдаёт `429`.
  title: VEDAL Portal — публичное API
  version: v1
servers:
- description: Generated server url
  url: http://localhost:8081
tags:
- description: "Опубликованные изделия и категории. Неопубликованного в ответах не\
    т: фильтр стоит в запросе, а не в разметке сайта."
  name: Каталог
- description: Опубликованные материалы ленты.
  name: Новости
- description: "Перечень документов и выдача файлов. Перечень показывается вместе\
    \ со статусом доступа, даже когда файла ещё нет; скачивается только опубликова\
    нное."
  name: Документы
- description: "Единственная дверь на запись снаружи. Авторизации нет — периметр з\
    десь составляют валидация, ловушка для ботов и лимит частоты."
  name: Формы
- description: "Урания отвечает только по опубликованным материалам. Подходящих ис\
    точников нет — ответа нет, есть передача человеку."
  name: Ассистент
paths:
  /api/assistant/v1/ask:
    post:
      description: |
        Отвечает только по опубликованным материалам портала: каталогу, ленте
        и перечню документов. Закрытого файла в ответе не будет, потому что
        его нет в контексте — движок ходит через интерфейсы модулей, а они
        отдают исключительно опубликованное.

        Вопросы про диагноз и цену отклоняются ограничениями до поиска.
        Подходящих источников не нашлось — ответа нет, приходит `handoff`
        с контактами и подходящими формами. Ответ всегда `200`: передача
        человеку это штатный исход, а не ошибка.

        Лимит частоты — 20 вопросов за 10 минут с адреса.
      operationId: ask
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AskReply"
          description: Ответ со ссылками на источники либо передача человеку.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Вопрос пуст или длиннее 500 символов.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Превышен лимит частоты.
      summary: Спросить Уранию
      tags:
      - Ассистент
  /api/assistant/v1/chat:
    post:
      description: |
        Заводит разговор при первом сообщении и отвечает Уранией по тем же
        правилам, что и `POST /ask`: только по опубликованному, без диагнозов
        и цен, без ответа при отсутствии источников.

        Когда ответа нет, разговор переходит в состояние `waiting` — ждёт
        сотрудника. С этого момента Урания молчит: машина, отвечающая поверх
        человека, выглядит как сотрудник, который не читает, что ему пишут.

        Возвращается вся лента разговора, а не одно новое сообщение: дописывание
        требует, чтобы клиент и сервер одинаково понимали, где кончилось прошлое
        состояние, а при обрыве связи они понимают это по-разному.

        Лимит частоты общий с `ask` — 20 обращений за 10 минут с адреса.
      operationId: say
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatSay"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Thread"
          description: Лента разговора вместе с ответом.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Пустое сообщение или длиннее 1000 символов.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Превышен лимит частоты.
      summary: Написать в чат
      tags:
      - Ассистент
  /api/assistant/v1/chat/{visitorKey}:
    get:
      description: |
        Лента по ключу браузера. Разговора нет — пустая лента, а не 404:
        для виджета «ещё не писали» и «не нашли» это одно и то же состояние,
        и различать их незачем.
      operationId: thread
      parameters:
      - in: path
        name: visitorKey
        required: true
        schema:
          type: string
          maxLength: 64
          minLength: 0
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Thread"
          description: "Лента разговора, возможно пустая."
      summary: Прочитать разговор
      tags:
      - Ассистент
  /api/assistant/v1/chat/{visitorKey}/stream:
    get:
      description: |
        Поток событий (`text/event-stream`). Приходит событие `changed`
        с идентификатором разговора — и только оно: ни текста, ни автора.
        Текст забирается следующим запросом `GET /chat/{visitorKey}`,
        который проходит обычную проверку.

        Так сделано намеренно: положи мы тело сообщения в событие, и
        рассылка стала бы вторым местом, где решается, кому что видно.

        Разговора ещё нет — поток открывается и молчит: посетитель мог
        открыть виджет до первого сообщения, и отказ здесь означал бы,
        что виджету надо самому решать, когда подписываться.

        Соединение живёт полчаса, после чего браузер переподключается сам.
      operationId: stream
      parameters:
      - in: path
        name: visitorKey
        required: true
        schema:
          type: string
          maxLength: 64
          minLength: 0
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SseEmitter"
          description: Поток событий.
      summary: Поток обновлений разговора
      tags:
      - Ассистент
  /api/forms/v1/leads:
    post:
      description: |
        Принимает заявку с любой из пяти форм сайта.

        Отвечает `202 Accepted`, а не `201`: заявка принята и поставлена
        в разбор менеджеру, готового ресурса за ней не стоит.

        Периметр этой двери — валидация полей, скрытая ловушка для ботов
        и лимит частоты по адресу клиента: 5 обращений за 10 минут.
      operationId: submit
      parameters:
      - description: "Ключ повторной отправки. С тем же ключом заявка не задваивае\
          тся — вернётся расписка на уже принятую. Необязателен, но без него повто\
          рное нажатие кнопки создаёт вторую заявку."
        example: 5a1c9f6e-77b2-4c3d-9e08-1f4a6b2c8d90
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadSubmission"
        required: true
      responses:
        "202":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LeadAccepted"
          description: Заявка принята.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Поля не прошли проверку — разбор в расширении `fields`; либо
            заявка отклонена по заполненной ловушке.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Превышен лимит частоты.
      summary: Отправить заявку
      tags:
      - Формы
  /api/public/v1/categories:
    get:
      description: В порядке показа на сайте.
      operationId: categories
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
          description: Список категорий. Кэш пять минут.
      summary: Категории каталога
      tags:
      - Каталог
  /api/public/v1/documents:
    get:
      description: "Показывается вместе со статусом доступа, в том числе строки бе\
        з файла: такая строка на сайте ведёт на запрос. Ссылка `fileUrl` заполнена\
        \ только у опубликованных."
      operationId: documents
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentCard"
          description: Перечень документов. Кэш пять минут.
      summary: Перечень документов
      tags:
      - Документы
  /api/public/v1/documents/{slug}/file:
    get:
      description: |
        Отдаёт файл вложением. Скачать можно только опубликованный документ
        с загруженным файлом.

        Неопубликованный документ отвечает `404`, а не `403`: по коду ответа
        не должно быть видно, что такой документ вообще есть. Каждая попытка
        попадает в журнал.

        Ответ не кэшируется: снятая с публикации редакция не должна остаться
        в кэшах прокси.
      operationId: file
      parameters:
      - description: Идентификатор документа в URL.
        example: opisanie-izdeliya-vedal-r1-r2
        in: path
        name: slug
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: "Файл вложением, `Content-Disposition: attachment`."
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Документа нет, он не опубликован или файл недоступен."
      summary: Файл документа
      tags:
      - Документы
  /api/public/v1/news:
    get:
      description: "Только опубликованные, свежие сверху. Без текста материала — о\
        н приходит в отдельном запросе."
      operationId: news
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsCard"
          description: Список материалов. Кэш пять минут.
      summary: Лента материалов
      tags:
      - Новости
  /api/public/v1/news/{slug}:
    get:
      description: Неопубликованный материал отдаёт `404`.
      operationId: article
      parameters:
      - description: Идентификатор материала в URL.
        example: postavka-v-perinatalnyy-centr
        in: path
        name: slug
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NewsArticle"
          description: Материал. Кэш пять минут.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Материал не опубликован или его нет.
      summary: Материал целиком
      tags:
      - Новости
  /api/public/v1/products:
    get:
      description: Только опубликованные — фильтр стоит в запросе к базе. Полный состав
        характеристик отдаёт карточка изделия.
      operationId: products
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductCard"
          description: Список изделий. Кэш пять минут.
      summary: Опубликованные изделия
      tags:
      - Каталог
  /api/public/v1/products/{slug}:
    get:
      description: "Неопубликованное изделие отдаёт `404`, а не пустую карточку: д\
        ля внешнего мира его не существует."
      operationId: product
      parameters:
      - description: Идентификатор изделия в URL.
        example: vedal-r1-r2
        in: path
        name: slug
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDetail"
          description: Карточка изделия. Кэш пять минут.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Изделие не опубликовано или его нет.
      summary: Карточка изделия
      tags:
      - Каталог
components:
  schemas:
    AskReply:
      type: object
      description: |
        Ответ Урании. Заполнено ровно одно из двух: либо `answer` со списком
        `sources`, либо `handoff` — тогда `sources` пуст.

        Ответа без источников не бывает: движок работает поверх опубликованного,
        и придумывать ответ, когда подходящих материалов нет, запрещено.
      properties:
        answer:
          type: string
          description: "Текст ответа. При передаче человеку сюда попадает причина\
            \ — тот же текст, что и в `handoff.reason`."
        handoff:
          type: "null"
          $ref: "#/components/schemas/Handoff"
          description: "Передача специалисту. `null`, когда ответ дан."
        sources:
          type: array
          description: "Материалы, на которых построен ответ. Пуст при передаче че\
            ловеку."
          items:
            $ref: "#/components/schemas/Source"
    AskRequest:
      type: object
      description: Вопрос Урании.
      properties:
        question:
          type: string
          description: "Текст вопроса. В журнал он не попадает: посетитель может у\
            казать в нём и клинику, и себя."
          example: Какие каналы мониторинга у инкубатора-трансформера?
          maxLength: 500
          minLength: 0
      required:
      - question
    Category:
      type: object
      description: Категория каталога.
      properties:
        name:
          type: string
          description: Название для показа.
          example: Неонатология
        slug:
          type: string
          description: Идентификатор в URL.
          example: неонатология
    ChatSay:
      type: object
      description: Сообщение посетителя.
      properties:
        campaign:
          type:
          - string
          - "null"
          description: "Метка кампании, с которой пришёл посетитель."
          maxLength: 128
          minLength: 0
        language:
          type:
          - string
          - "null"
          description: "Язык страницы, с которой пишут."
          maxLength: 8
          minLength: 0
        page:
          type:
          - string
          - "null"
          description: "Страница, с которой открыт виджет."
          maxLength: 512
          minLength: 0
        text:
          type: string
          description: Текст сообщения.
          maxLength: 1000
          minLength: 0
        visitorKey:
          type: string
          description: |
            Случайный ключ, который виджет заводит в браузере и хранит между
            страницами. По нему находится разговор. О посетителе не сообщает
            ничего: это идентификатор вкладки, а не человека.
          example: b1f0c2de-9a7e-4d21-8c33-0f2a5e6d7b48
          maxLength: 64
          minLength: 0
      required:
      - text
      - visitorKey
    DocumentCard:
      type: object
      description: "Строка перечня документов. В перечень попадают и те документы\
        , файла у которых ещё нет: страница показывает их вместе со статусом досту\
        па, и такая строка ведёт на запрос, а не на скачивание."
      properties:
        access:
          type: string
          description: "Как документ достаётся: `pdf` — файл на сайте, `on_request`\
            \ — по запросу, `pending` — уточняется."
          enum:
          - pdf
          - on_request
          - pending
          example: pdf
        fileUrl:
          type:
          - string
          - "null"
          description: Ссылка на файл. Заполнена только у опубликованных — собирать
            её на стороне сайта значит однажды собрать её для закрытого документа.
          example: /api/public/v1/documents/opisanie-izdeliya-vedal-r1-r2/file
        group:
          type: string
          description: Раздел перечня.
          example: Лицензирование
        productSlug:
          type:
          - string
          - "null"
          description: "Изделие, к которому привязан документ. `null` у общих доку\
            ментов."
          example: vedal-r1-r2
        published:
          type: boolean
          description: Файл согласован к публикации и доступен для скачивания.
        slug:
          type: string
          description: Идентификатор в URL.
          example: registracionnoe-udostoverenie-vedal-r1-r2
        subject:
          type: string
          description: "К чему относится документ: изделие или организация."
          example: "VEDAL R1, R2"
        title:
          type: string
          description: Название документа.
          example: Регистрационное удостоверение
    Handoff:
      type: object
      description: "Куда обращаться, когда ассистент не отвечает."
      properties:
        email:
          type: string
          description: Почта отдела продаж.
          example: sales@vedal-med.ru
        forms:
          type: array
          description: "Формы, которые уместно предложить вместо ответа."
          example:
          - quote
          - catalog
          - consultation
          - service
          items:
            type: string
        phone:
          type: string
          description: Телефон отдела продаж.
          example: 8 800 600 3449
        reason:
          type: string
          description: "Почему ответа нет: вопрос отклонён ограничениями (диагноз\
            , цена) или по опубликованному ничего не нашлось."
    LeadAccepted:
      type: object
      description: Расписка о принятой заявке.
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор заявки. Повтор с тем же `Idempotency-Key` вернёт
            этот же идентификатор.
          example: 3f2a7c18-9d41-4a6b-8f0e-2b9c5d7e1a34
        message:
          type: string
          description: Текст для показа посетителю.
          example: Спасибо. Специалист VEDAL свяжется с вами.
    LeadSubmission:
      type: object
      description: |
        Заявка с сайта. Один формат на все пять форм — они отличаются полем `form`
        и тем, какие поля показывает интерфейс; проверки на сервере одинаковые.

        Отказ по проверкам приходит как `400` с разбором по полям в расширении
        `fields`, чтобы форма показала ошибку рядом с полем.
      properties:
        campaign:
          type: string
          description: "Кампания, приведшая посетителя: `utm_campaign` или её анал\
            ог. Разрез аналитики, необязателен."
          example: innoprom-2026
          maxLength: 200
          minLength: 0
        company:
          type: string
          description: Организация. Необязательно.
          example: Областной перинатальный центр
        consent:
          type: boolean
          description: "Согласие на обработку персональных данных. Без `true` заяв\
            ка не принимается. В заявке сохраняется версия текста согласия, а не с\
            ама галочка."
          example: true
        email:
          type: string
          format: email
          description: Адрес почты для ответа.
          example: i.petrova@example.ru
          minLength: 1
        form:
          type: string
          description: |-
            Какая форма отправлена: `quote` — запрос цены, `catalog` — запрос каталога,
            `consultation` — консультация, `service` — обращение в сервис,
            `partner` — партнёрство.
          enum:
          - quote
          - catalog
          - consultation
          - service
          - partner
          example: quote
          minLength: 1
          pattern: quote|catalog|consultation|service|partner
        language:
          type: string
          description: |-
            Язык страницы, с которой отправлена заявка: двухбуквенный код. Разрез
            аналитики — без него «по языку» посчитать нечем. Необязателен: заявка
            без него принимается и попадает в отчёт строкой «—».
          enum:
          - ru
          - en
          - zh
          example: ru
          pattern: "^$|^[a-zA-Z]{2}$"
        message:
          type: string
          description: "Текст обращения, не короче десяти символов."
          example: Интересует поставка двух систем R2 и сроки изготовления.
          maxLength: 2147483647
          minLength: 10
        name:
          type: string
          description: Имя обращающегося.
          example: Ирина Петрова
          minLength: 1
        phone:
          type: string
          description: "Телефон с кодом: не меньше десяти цифр, разделители любые."
          example: +7 343 300-00-00
          minLength: 1
          pattern: "^(?:\\D*\\d){10,}\\D*$"
        productSlug:
          type: string
          description: "Изделие, из карточки которого отправлена заявка. Необязате\
            льно."
          example: vedal-r1-r2
        trap:
          type: string
          description: "Ловушка для ботов: поле скрыто в разметке и должно приходи\
            ть пустым. Заполненное — заявка отклоняется с `400`."
      required:
      - consent
      - email
      - form
      - message
      - name
      - phone
    Line:
      type: object
      properties:
        actor:
          type: string
        at:
          type: string
          format: date-time
        author:
          type: string
        body:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"
    NewsArticle:
      type: object
      description: Материал ленты целиком.
      properties:
        body:
          type:
          - string
          - "null"
          description: "Текст материала. `null`, если заполнен только анонс."
        excerpt:
          type: string
          description: Анонс для списка.
        imageAlt:
          type:
          - string
          - "null"
          description: Подпись к иллюстрации.
        imageSrc:
          type:
          - string
          - "null"
          description: Путь к иллюстрации на сайте.
        publishedOn:
          type: string
          format: date
          description: Дата публикации.
          example: 2026-08-13
        slug:
          type: string
          description: Идентификатор в URL.
          example: postavka-v-perinatalnyy-centr
        tag:
          type: string
          description: Рубрика.
          example: Производство
        title:
          type: string
          description: Заголовок.
    NewsCard:
      type: object
      description: "Материал ленты в списке, без текста."
      properties:
        excerpt:
          type: string
          description: Анонс для списка.
        imageAlt:
          type:
          - string
          - "null"
          description: Подпись к иллюстрации.
        imageSrc:
          type:
          - string
          - "null"
          description: Путь к иллюстрации на сайте.
        publishedOn:
          type: string
          format: date
          description: "Дата публикации. Сайт показывает её словами, разбор формат\
            а — забота интерфейса."
          example: 2026-08-13
        slug:
          type: string
          description: Идентификатор в URL.
          example: postavka-v-perinatalnyy-centr
        tag:
          type: string
          description: Рубрика.
          enum:
          - Продукция
          - Производство
          - Выставки
          - Сервис
          - Документы
          example: Производство
        title:
          type: string
          description: Заголовок.
    ProblemDetail:
      description: "Ошибка в формате RFC 9457, `application/problem+json`."
      properties:
        detail:
          type: string
        fields:
          additionalProperties:
            type: string
          description: "Только у 400 от формы: поле → причина отказа. Форма показы\
            вает ошибку рядом с полем, а не одной строкой сверху."
          example:
            consent: Без согласия отправить запрос нельзя
            email: Проверьте адрес почты
        instance:
          type: string
          format: uri
        status:
          format: int32
          example: 400
        title:
          type: string
          description: Причина словами — её показывает сайт.
          example: Проверьте заполнение полей
        type:
          type: string
          format: uri
          default: about:blank
    ProductCard:
      type: object
      description: Изделие в списке. Полный состав характеристик отдаёт карточка изделия.
      properties:
        categories:
          type: array
          description: "Названия категорий, к которым отнесено изделие."
          example:
          - Реанимация
          - Неонатология
          items:
            type: string
        docStatus:
          type: string
          description: "Состояние регистрационных документов. `confirmed` — сведен\
            ия подтверждены документами, `pending` — ещё уточняются. Это не флаг п\
            убликации: неопубликованного изделия в ответе нет вообще."
          enum:
          - confirmed
          - pending
          example: confirmed
        imageAlt:
          type:
          - string
          - "null"
          description: Подпись к фотографии. `null` вместе с `imageSrc`.
