      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminProduct"
          description: OK
      security:
      - keycloak: []
      summary: Изделие целиком
      tags:
      - "Админка: каталог"
    put:
      description: "Переименование опубликованного изделия отклоняется: адрес карт\
        очки уже разослан и проиндексирован."
      operationId: update
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProductForm"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminProduct"
          description: OK
      security:
      - keycloak: []
      summary: Правка изделия
      tags:
      - "Админка: каталог"
  /api/admin/v1/products/{id}/publish:
    post:
      operationId: publish
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminProduct"
          description: OK
      security:
      - keycloak: []
      summary: Опубликовать изделие
      tags:
      - "Админка: каталог"
  /api/admin/v1/products/{id}/unpublish:
    post:
      description: Изделие сразу пропадает с сайта. Данные остаются.
      operationId: unpublish
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminProduct"
          description: OK
      security:
      - keycloak: []
      summary: Снять изделие с публикации
      tags:
