openapi: 3.1.0
info:
  contact:
    email: sales@vedal-med.ru
    name: VEDAL
    url: tel:88006003449
  description: |
    Контракт сайта vedal-med.ru с серверной частью портала.

    Двери и их правила:

    - `/api/public/v1/**` — чтение опубликованного. Ответы кэшируются
      на пять минут (`Cache-Control: max-age=300, public`); файлы
      документов не кэшируются вовсе, потому что снятая с публикации
      редакция не должна жить в кэшах прокси.
    - `/api/forms/v1/**` — приём заявок. Отвечает `202 Accepted`:
      заявка принята, дальше её разбирает менеджер.
    - `/api/assistant/v1/**` — вопрос ассистенту.

    Ошибки во всех дверях — `application/problem+json` по RFC 9457.
    Разбор по полям формы приезжает в расширении `fields`.

    Кросс-доменные запросы разрешены только источникам из
    `vedal.web.allowed-origins`, без передачи учётных данных: у
    публичных дверей нет ни cookie, ни сессии. Повторную отправку
    заявки различает заголовок `Idempotency-Key`, а не пользователь.

    Лимит частоты считается по адресу клиента, у каждой двери свой
    бюджет: формы — 5 обращений за 10 минут, ассистент — 20.
    Превышение отдаёт `429`.
  title: VEDAL Portal — публичное API
  version: v1
servers:
- description: Generated server url
  url: http://localhost:8081
tags:
- description: "Опубликованные изделия и категории. Неопубликованного в ответах не\
    т: фильтр стоит в запросе, а не в разметке сайта."
  name: Каталог
- description: Опубликованные материалы ленты.
  name: Новости
- description: "Перечень документов и выдача файлов. Перечень показывается вместе\
    \ со статусом доступа, даже когда файла ещё нет; скачивается только опубликова\
    нное."
  name: Документы
- description: "Единственная дверь на запись снаружи. Авторизации нет — периметр з\
    десь составляют валидация, ловушка для ботов и лимит частоты."
  name: Формы
- description: "Урания отвечает только по опубликованным материалам. Подходящих ис\
    точников нет — ответа нет, есть передача человеку."
  name: Ассистент
paths:
  /api/admin/v1/audit:
    get:
      operationId: entries
      parameters:
      - description: "Тип объекта: product, news, document, lead, category."
        in: query
        name: subject
        required: false
        schema:
          type: string
      - description: Идентификатор объекта — slug или UUID заявки.
        in: query
        name: subjectId
        required: false
        schema:
          type: string
      - description: Логин исполнителя.
        in: query
        name: actor
        required: false
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Page"
          description: OK
      security:
      - keycloak: []
      summary: "Журнал постранично, свежие сверху"
      tags:
      - "Админка: журнал"
  /api/admin/v1/audit/chain/{correlationId}:
    get:
      description: "Цепочка собирается по correlation_id и переживает границу план\
        ировщика: relay работает в другом потоке, и без этого связь письма с заявк\
        ой, которая его породила, теряется."
      operationId: chain
      parameters:
      - in: path
        name: correlationId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"
          description: OK
      security:
      - keycloak: []
      summary: Весь путь одного запроса
      tags:
      - "Админка: журнал"
  /api/admin/v1/categories:
    get:
      operationId: categories
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminCategory"
          description: OK
      security:
      - keycloak: []
      summary: Категории каталога
      tags:
      - "Админка: каталог"
    post:
      operationId: createCategory
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCategoryForm"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminCategory"
          description: OK
      security:
      - keycloak: []
      summary: Завести категорию
      tags:
      - "Админка: каталог"
  /api/admin/v1/categories/{id}:
    delete:
      description: "Отклоняется, если в категории есть изделия: в схеме на связке\
        \ стоит on delete restrict."
      operationId: deleteCategory
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
      security:
      - keycloak: []
      summary: Удалить категорию
      tags:
      - "Админка: каталог"
    put:
      operationId: updateCategory
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCategoryForm"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminCategory"
          description: OK
      security:
      - keycloak: []
      summary: Правка категории
      tags:
      - "Админка: каталог"
  /api/admin/v1/documents:
    get:
      description: "Включая внутренние и конфиденциальные — их нет в публичном пер\
        ечне. У каждой строки поле `publishBlockedBy` объясняет, почему кнопка пуб\
        ликации недоступна."
      operationId: documents
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminDocumentRow"
          description: OK
      security:
      - keycloak: []
      summary: Все документы
      tags:
      - "Админка: документы"
    post:
      description: Создаётся без файла и без публикации.
      operationId: create_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDocumentForm"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminDocumentRow"
          description: OK
      security:
      - keycloak: []
      summary: Завести документ
      tags:
      - "Админка: документы"
  /api/admin/v1/documents/vocabulary:
    get:
      description: Закрытые списки из проверок в схеме.
      operationId: vocabulary
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
          description: OK
      security:
      - keycloak: []
      summary: "Справочники разделов, секретности и доступа"
      tags:
      - "Админка: документы"
  /api/admin/v1/documents/{id}:
    get:
      operationId: document
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminDocumentRow"
          description: OK
      security:
      - keycloak: []
      summary: Документ
      tags:
      - "Админка: документы"
    put:
      operationId: update_2
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDocumentForm"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
