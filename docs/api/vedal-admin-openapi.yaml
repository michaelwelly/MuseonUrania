      tags:
      - "Админка: сессия"
components:
  schemas:
    AdminCategory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: integer
          format: int32
        productCount:
          type: integer
          format: int64
        slug:
          type: string
    AdminCategoryForm:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 0
        position:
          type: integer
          format: int32
        slug:
          type: string
          minLength: 1
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      required:
      - name
      - slug
    AdminDocumentForm:
      type: object
      properties:
        access:
          type: string
          description: "Планируемый уровень доступа, бейдж на сайте."
          enum:
          - pdf
          - on_request
          - pending
          minLength: 1
        group:
          type: string
          description: Раздел перечня.
          enum:
          - Лицензирование
          - Система качества
          - Техническая документация
          - Коммерческие материалы
          minLength: 1
        listed:
          type: boolean
          description: Строка видна в публичном перечне. Это не публикация файла.
        productSlug:
          type:
          - string
          - "null"
          description: "Изделие, к которому привязан документ."
          maxLength: 200
          minLength: 0
        revision:
          type: string
          maxLength: 100
          minLength: 0
        sensitivity:
          type: string
          description: "Уровень секретности. Опубликовать можно только `public` —\
            \ это ограничение схемы, а не дисциплина редактора."
          enum:
          - public
          - internal
          - confidential
          minLength: 1
        slug:
          type: string
          minLength: 1
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        sourceOwner:
          type: string
          maxLength: 200
          minLength: 0
        subject:
          type: string
          description: К чему относится документ.
          example: "VEDAL R1, R2"
          maxLength: 300
          minLength: 0
        title:
          type: string
          maxLength: 300
          minLength: 0
        version:
          type:
          - integer
          - "null"
          format: int64
          description: "Версия карточки, прочитанная перед правкой. Обязательна пр\
            и обновлении, при создании игнорируется."
      required:
      - access
      - group
      - sensitivity
      - slug
      - subject
      - title
    AdminDocumentRow:
      type: object
      description: Строка списка документов в админке.
      properties:
        access:
          type: string
        approvedBy:
          type: string
        fileSize:
          type: integer
          format: int64
        group:
          type: string
        hasFile:
          type: boolean
        id:
          type: string
          format: uuid
        listed:
          type: boolean
        productSlug:
          type: string
        publishBlockedBy:
          type:
          - string
          - "null"
          description: "Почему документ нельзя опубликовать прямо сейчас. `null` —\
            \ можно. Считается по тем же правилам, что закрыты ограничениями схемы\
            , чтобы кнопка объясняла отказ заранее."
        published:
          type: boolean
        revision:
          type: string
        sensitivity:
          type: string
        slug:
          type: string
        subject:
          type: string
        title:
          type: string
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          description: Версия карточки. Её надо вернуть в форме правки.
    AdminLead:
      type: object
      description: "Заявка целиком, вместе с текстом и согласием."
      properties:
        company:
          type: string
        consentAt:
          type: string
          format: date-time
        consentVersion:
          type: string
          description: "Версия текста согласия, с которым человек согласился. Хран\
            ится версия, а не галочка: через год иначе не доказать, с чем именно о\
            н согласился."
        correlationId:
          type:
          - string
          - "null"
          description: Идентификатор цепочки запроса. По нему в журнале собирается
            весь путь заявки.
        createdAt:
          type: string
          format: date-time
        email:
          type: string
        form:
          type: string
        id:
          type: string
          format: uuid
        message:
          type: string
        name:
          type: string
        owner:
          type: string
        phone:
          type: string
        productSlug:
          type: string
        source:
          type: string
        status:
          type: string
    AdminLeadRow:
      type: object
      description: |
        Строка списка заявок. Телефон и почта здесь есть: это рабочий
        инструмент менеджера, а не публичная выдача. Дверь закрыта
        аутентификацией, и каждое изменение попадает в журнал.
      properties:
        company:
          type: string
        createdAt:
          type: string
          format: date-time
        email:
          type: string
        form:
          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
        owner:
          type: string
        phone:
          type: string
        productSlug:
          type: string
        source:
          type: string
        status:
          type: string
    AdminLeadTriage:
      type: object
      description: "Разбор заявки: статус и ответственный."
      properties:
        owner:
          type:
          - string
          - "null"
          description: Логин ответственного. Пусто — снять ответственного.
          maxLength: 200
          minLength: 0
        status:
          type: string
          enum:
          - draft
          - new
          - in_progress
          - won
          - lost
          minLength: 1
      required:
      - status
    AdminNews:
      type: object
      description: "Материал целиком, как его правит редактор."
      properties:
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        excerpt:
          type: string
        id:
          type: string
          format: uuid
        imageAlt:
          type: string
        imageSrc:
          type: string
        published:
          type: boolean
        publishedOn:
          type: string
          format: date
        slug:
          type: string
        tag:
          type: string
        title:
          type: string
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          description: Версия материала. Её надо вернуть в форме правки.
    AdminNewsForm:
      type: object
      description: |
        Правка материала. `published` здесь нет: публикация — отдельное
        действие. `publishedOn` — дата в ленте, она задаётся заранее
        и к видимости отношения не имеет.
      properties:
        body:
          type:
          - string
          - "null"
          description: Текст материала.
          maxLength: 100000
          minLength: 0
        excerpt:
          type: string
          description: Анонс для ленты.
          maxLength: 1000
          minLength: 0
        imageAlt:
          type: string
          maxLength: 500
          minLength: 0
        imageSrc:
          type: string
          maxLength: 500
          minLength: 0
        publishedOn:
          type:
          - string
          - "null"
          format: date
          description: "Дата в ленте. Без неё материал нельзя опубликовать — это о\
            граничение схемы, а не пожелание."
          example: 2026-08-13
        slug:
          type: string
          description: Идентификатор в URL.
          example: postavka-v-perinatalnyy-centr
          minLength: 1
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        tag:
          type: string
          description: Рубрика из закрытого списка.
          enum:
          - Продукция
          - Производство
          - Выставки
          - Сервис
          - Документы
          minLength: 1
        title:
          type: string
          maxLength: 300
          minLength: 0
        version:
          type:
          - integer
          - "null"
          format: int64
          description: "Версия материала, прочитанная перед правкой. Обязательна п\
            ри обновлении, при создании игнорируется."
      required:
      - excerpt
      - slug
      - tag
      - title
    AdminNewsRow:
      type: object
      description: "Строка списка материалов, включая черновики."
      properties:
        id:
          type: string
          format: uuid
        published:
          type: boolean
        publishedOn:
          type: string
          format: date
        slug:
          type: string
        tag:
          type: string
        title:
          type: string
        updatedAt:
          type: string
          format: date-time
    AdminProduct:
      type: object
      description: "Изделие целиком, как его правит редактор."
      properties:
        categorySlugs:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        detail:
          type: string
        docStatus:
          type: string
        id:
          type: string
          format: uuid
        imageAlt:
          type: string
        imageSrc:
          type: string
        keyParams:
          type: array
          items:
            $ref: "#/components/schemas/AdminProductSpec"
        kind:
          type: string
        name:
          type: string
        published:
          type: boolean
        slug:
          type: string
        sortOrder:
          type: integer
          format: int32
        specs:
          type: array
          items:
            $ref: "#/components/schemas/AdminProductSpec"
        summary:
          type: string
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          description: "Версия карточки. Её надо вернуть в форме правки — по ней п\
            ортал отличает «правлю то, что прочитал» от «правлю то, что за это вре\
            мя поменял кто-то другой»."
    AdminProductForm:
      type: object
      description: |
        Правка изделия. Поля `published` здесь нет намеренно: публикация —
        отдельное действие, а не поле формы. Снятие с публикации убирает
        изделие с сайта, и это не должно случаться заодно с правкой текста.
      properties:
        categorySlugs:
          type: array
          description: Категории каталога по slug'ам.
          items:
            type: string
            minLength: 1
        detail:
          type:
          - string
          - "null"
          description: Развёрнутое описание. Пусто — карточка покажет только summary.
          maxLength: 20000
          minLength: 0
        docStatus:
          type: string
          description: "Подтверждены ли характеристики датащитом. Это НЕ видимость\
            \ на сайте: бейдж рисуется по нему, а показ — по published."
          enum:
          - confirmed
          - pending
          minLength: 1
          pattern: confirmed|pending
        imageAlt:
          type: string
          maxLength: 500
          minLength: 0
        imageSrc:
          type:
          - string
          - "null"
          description: "Путь к снимку в медиа-хранилище, без хоста: имя хоста — св\
            ойство окружения, и в данных ему не место."
          example: /photos/products/vedal-a-2000.jpg
          maxLength: 500
          minLength: 0
        keyParams:
          type: array
          description: Четыре строки под заголовком карточки.
          items:
            $ref: "#/components/schemas/AdminProductSpecForm"
        kind:
          type: string
          description: "Тип изделия строкой, как он показан на карточке."
          example: Инкубатор-трансформер
          maxLength: 200
          minLength: 0
        name:
          type: string
          maxLength: 200
          minLength: 0
        slug:
          type: string
          description: "Идентификатор в URL. Только латиница, цифры и дефис."
          example: vedal-a-2000
          minLength: 1
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        sortOrder:
          type: integer
          format: int32
        specs:
          type: array
          description: Таблица характеристик на вкладке изделия.
          items:
            $ref: "#/components/schemas/AdminProductSpecForm"
        summary:
          type: string
          description: Короткое описание для карточки в списке.
          maxLength: 1000
          minLength: 0
        version:
          type:
          - integer
          - "null"
          format: int64
          description: "Версия карточки, прочитанная перед правкой. Обязательна пр\
            и обновлении, при создании игнорируется. Форма без версии отклоняется\
            : сохранить вслепую значит затереть чужую правку."
          example: 3
      required:
      - docStatus
      - kind
      - name
      - slug
      - summary
    AdminProductRow:
      type: object
      description: Строка списка изделий в админке. Показывает и неопубликованное
        — в этом её отличие от публичного каталога.
      properties:
        categories:
          type: array
          items:
            type: string
        docStatus:
          type: string
        id:
          type: string
          format: uuid
        kind:
          type: string
        name:
          type: string
        published:
          type: boolean
        slug:
          type: string
        sortOrder:
          type: integer
          format: int32
        summary:
          type: string
        updatedAt:
          type: string
          format: date-time
    AdminProductSpec:
      type: object
      description: Строка характеристик.
      properties:
        label:
          type: string
        muted:
          type: boolean
        value:
          type: string
    AdminProductSpecForm:
      type: object
      properties:
        label:
          type: string
          maxLength: 200
          minLength: 0
        muted:
          type: boolean
        value:
          type: string
          maxLength: 500
          minLength: 0
      required:
      - label
      - value
    AdminSession:
      type: object
      properties:
        actor:
          type: string
          description: "Логин, под которым действия попадут в журнал."
        authentication:
          type: string
          description: "Как портал проверяет вход: `keycloak` или `local`."
        roles:
          type: array
          description: "Роли, которые портал разобрал в токене."
          items:
            type: string
    AuditEntry:
      type: object
      description: Запись журнала.
      properties:
        action:
          type: string
        actor:
          type: string
        at:
          type: string
          format: date-time
        correlationId:
          type: string
        id:
          type: string
          format: uuid
        ip:
          type: string
        payload:
          type:
          - string
          - "null"
          description: "Подробности действия в JSON. Персональных данных здесь нет\
            : в журнал пишутся идентификаторы, а не имена и адреса."
        subject:
          type: string
        subjectId:
          type: string
    Page:
      type: object
      description: Страница списка.
      properties:
        items:
          type: array
          description: Строки страницы.
          items:
            $ref: "#/components/schemas/AdminLeadRow"
        page:
          type: integer
          format: int32
          description: "Номер страницы, с нуля."
          example: 0
        pages:
          type: integer
          format: int32
          description: Всего страниц.
          example: 3
        size:
          type: integer
          format: int32
          description: Размер страницы.
          example: 50
        total:
          type: integer
          format: int64
          description: Всего строк во всей выборке.
          example: 137
    UploadedMedia:
      type: object
      properties:
        path:
          type: string
          description: "Путь для поля imageSrc. Без хоста: имя хоста — свойство ок\
            ружения, и в данных ему не место."
          example: /photos/products/vedal-a-2000.jpg
        size:
          type: integer
          format: int64
  securitySchemes:
    keycloak:
      bearerFormat: JWT
      description: |
        Токен доступа из Keycloak. Роли портала — `portal-admin`
        и `portal-editor` в `realm_access.roles`; токен без них
        проходит проверку подписи и получает `403`.

        В режиме `vedal.iam.mode=local` вместо этого работает
        HTTP Basic поверх учётных записей портала — режим
        разработки, не контракт.
      scheme: bearer
      type: http
