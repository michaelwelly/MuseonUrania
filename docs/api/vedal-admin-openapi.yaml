          type: string
          description: Почта отдела продаж.
          example: sales@vedal-med.ru
        forms:
          type: array
          description: "Формы, которые уместно предложить вместо ответа."
          example:
          - quote
          - catalog
          - consultation
          - service
          items:
            type: string
        phone:
          type: string
          description: Телефон отдела продаж.
          example: 8 800 600 3449
        reason:
          type: string
          description: "Почему ответа нет: вопрос отклонён ограничениями (диагноз\
            , цена) или по опубликованному ничего не нашлось."
    Line:
      type: object
      properties:
        actor:
          type: string
        at:
          type: string
          format: date-time
        author:
          type: string
        body:
          type: string
        readAt:
          type: string
          format: date-time
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"
    Page:
      type: object
      description: Страница списка.
      properties:
        items:
          type: array
          description: Строки страницы.
          items:
            $ref: "#/components/schemas/AdminQuoteRow"
        page:
          type: integer
          format: int32
          description: "Номер страницы, с нуля."
          example: 0
        pages:
          type: integer
          format: int32
          description: Всего страниц.
          example: 3
        size:
          type: integer
          format: int32
          description: Размер страницы.
          example: 50
        total:
          type: integer
          format: int64
          description: Всего строк во всей выборке.
          example: 137
    PipelineView:
      type: object
      properties:
        lostStages:
          type: array
          description: "Стадии, которыми она заканчивается отказом. Чем воронка ко\
            нчается — правило домена, и форма берёт его отсюда: список, переписанн\
            ый в интерфейс, разъезжается с доменом на первой же новой воронке."
          items:
            type: string
        pipeline:
          type: string
        stages:
          type: array
          items:
            type: string
        wonStages:
          type: array
          description: "Стадии, которыми эта воронка заканчивается успехом."
          items:
            type: string
    ProblemDetail:
      description: "Ошибка в формате RFC 9457, `application/problem+json`."
      properties:
        detail:
          type: string
        fields:
          additionalProperties:
            type: string
          description: "Только у 400 от формы: поле → причина отказа. Форма показы\
            вает ошибку рядом с полем, а не одной строкой сверху."
          example:
            consent: Без согласия отправить запрос нельзя
            email: Проверьте адрес почты
        instance:
          type: string
          format: uri
        status:
          format: int32
          example: 400
        title:
          type: string
          description: Причина словами — её показывает сайт.
          example: Проверьте заполнение полей
        type:
          type: string
          format: uri
          default: about:blank
    Source:
      type: object
      description: "Опубликованный материал, на который опирается ответ."
      properties:
        kind:
          type: string
          description: Откуда материал взят.
          enum:
          - product
          - news
          - document
          example: product
        title:
          type: string
          description: Название материала. У изделия — название и тип через тире.
          example: VEDAL A-2000 — Инкубатор-трансформер
        url:
          type: string
          description: Адрес материала на сайте.
          example: /products/vedal-a-2000/
    SseEmitter:
      type: object
      properties:
        timeout:
          type: integer
          format: int64
    Thread:
      type: object
      properties:
        id:
          type: string
          format: uuid
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Line"
        status:
          type: string
    UploadedMedia:
      type: object
      properties:
        path:
          type: string
          description: "Путь для поля imageSrc. Без хоста: имя хоста — свойство ок\
            ружения, и в данных ему не место."
          example: /photos/products/vedal-a-2000.jpg
        size:
          type: integer
          format: int64
  securitySchemes:
    keycloak:
      bearerFormat: JWT
      description: |
        Токен доступа из Keycloak. Роли портала — `portal-admin`
        и `portal-editor` в `realm_access.roles`; токен без них
        проходит проверку подписи и получает `403`.

        В режиме `vedal.iam.mode=local` вместо этого работает
        HTTP Basic поверх учётных записей портала — режим
        разработки, не контракт.
      scheme: bearer
      type: http
