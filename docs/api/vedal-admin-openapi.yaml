      security:
      - keycloak: []
      summary: Правка карточки документа
      tags:
      - "Админка: документы"
  /api/admin/v1/documents/{id}/file:
    post:
      description: |
        Предел — 20 МБ на файл. Отказ приходит из разбора multipart,
        то есть до того, как тело целиком попало в память приложения,
        и отвечает `413` в формате problem+json.

        Загрузка не публикует документ: публикация — отдельное действие.
      operationId: upload_1
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminDocumentRow"
          description: OK
      security:
      - keycloak: []
      summary: Загрузить файл
      tags:
      - "Админка: документы"
  /api/admin/v1/documents/{id}/publish:
    post:
      description: "Отклоняется, если документ не `public`, без файла или не в пер\
        ечне. Причина приезжает в `409`, но та же тройка закрыта ограничениями схе\
        мы."
      operationId: publish_2
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminDocumentRow"
          description: OK
      security:
      - keycloak: []
      summary: Опубликовать документ
      tags:
      - "Админка: документы"
  /api/admin/v1/documents/{id}/unpublish:
    post:
      description: "Ссылка на файл перестаёт работать немедленно: ответы с файлами\
        \ не кэшируются как раз для этого."
      operationId: unpublish_2
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminDocumentRow"
          description: OK
      security:
      - keycloak: []
      summary: Снять документ с публикации
      tags:
      - "Админка: документы"
  /api/admin/v1/leads:
    get:
      operationId: leads
      parameters:
      - description: Фильтр по статусу. Пусто — все.
        in: query
        name: status
        required: false
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: "Размер страницы, не больше 200."
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Page"
          description: OK
      security:
      - keycloak: []
      summary: "Заявки постранично, свежие сверху"
      tags:
      - "Админка: заявки"
  /api/admin/v1/leads/statuses:
    get:
      operationId: statuses
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: string
          description: OK
      security:
      - keycloak: []
      summary: Статусы заявки
      tags:
      - "Админка: заявки"
  /api/admin/v1/leads/{id}:
    get:
      operationId: lead
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminLead"
          description: OK
      security:
      - keycloak: []
      summary: "Заявка целиком, с текстом и версией согласия"
      tags:
      - "Админка: заявки"
  /api/admin/v1/leads/{id}/triage:
    post:
      description: "Изменение попадает в журнал без персональных данных — только и\
        дентификатор заявки, старый и новый статус."
      operationId: triage
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLeadTriage"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminLead"
          description: OK
      security:
      - keycloak: []
      summary: "Разобрать заявку: статус и ответственный"
      tags:
      - "Админка: заявки"
  /api/admin/v1/media:
    post:
      description: |
        Кладёт файл в открытый на чтение бакет и возвращает путь для поля
        `imageSrc`. Имя файла собирается из `name`, а не из имени на диске
        редактора: пробелы, кириллица и `..` в ключе объектного хранилища
        ничем хорошим не заканчиваются.
      operationId: upload
      parameters:
      - in: query
        name: folder
        required: true
        schema:
          type: string
      - description: "Имя файла без расширения. Только латиница в нижнем регистре\
          , цифры и дефис."
        example: vedal-a-2000
        in: query
        name: name
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UploadedMedia"
          description: OK
      security:
      - keycloak: []
      summary: Загрузить изображение
      tags:
      - "Админка: изображения"
  /api/admin/v1/news:
    get:
      operationId: news
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminNewsRow"
          description: OK
      security:
      - keycloak: []
      summary: "Все материалы, включая черновики"
      tags:
      - "Админка: новости"
    post:
      description: Создаётся черновиком.
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminNewsForm"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminNews"
          description: OK
      security:
      - keycloak: []
      summary: Завести материал
      tags:
      - "Админка: новости"
  /api/admin/v1/news/tags:
    get:
      description: "Закрытый список из проверки в схеме. Админка рисует по нему вы\
        бор, а не свободное поле."
      operationId: tags
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: string
          description: OK
      security:
      - keycloak: []
      summary: Рубрики
      tags:
      - "Админка: новости"
  /api/admin/v1/news/{id}:
