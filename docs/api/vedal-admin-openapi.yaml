openapi: 3.1.0
info:
  contact:
    email: sales@vedal-med.ru
    name: VEDAL
    url: tel:88006003449
  description: |
    Контракт сайта vedal-med.ru с серверной частью портала.

    Двери и их правила:

    - `/api/public/v1/**` — чтение опубликованного. Ответы кэшируются
      на пять минут (`Cache-Control: max-age=300, public`); файлы
      документов не кэшируются вовсе, потому что снятая с публикации
      редакция не должна жить в кэшах прокси.
    - `/api/forms/v1/**` — приём заявок. Отвечает `202 Accepted`:
      заявка принята, дальше её разбирает менеджер.
    - `/api/assistant/v1/**` — вопрос ассистенту.

    Ошибки во всех дверях — `application/problem+json` по RFC 9457.
    Разбор по полям формы приезжает в расширении `fields`.

    Кросс-доменные запросы разрешены только источникам из
    `vedal.web.allowed-origins`, без передачи учётных данных: у
    публичных дверей нет ни cookie, ни сессии. Повторную отправку
    заявки различает заголовок `Idempotency-Key`, а не пользователь.

    Лимит частоты считается по адресу клиента, у каждой двери свой
    бюджет: формы — 5 обращений за 10 минут, ассистент — 20.
    Превышение отдаёт `429`.
  title: VEDAL Portal — публичное API
  version: v1
servers:
- description: Generated server url
  url: http://localhost:8081
tags:
- description: "Опубликованные изделия и категории. Неопубликованного в ответах не\
    т: фильтр стоит в запросе, а не в разметке сайта."
  name: Каталог
- description: Опубликованные материалы ленты.
  name: Новости
- description: "Перечень документов и выдача файлов. Перечень показывается вместе\
    \ со статусом доступа, даже когда файла ещё нет; скачивается только опубликова\
    нное."
  name: Документы
- description: "Единственная дверь на запись снаружи. Авторизации нет — периметр з\
    десь составляют валидация, ловушка для ботов и лимит частоты."
  name: Формы
- description: "Ведалина отвечает только по опубликованным материалам. Подходящих\
    \ источников нет — ответа нет, есть передача человеку."
  name: Ассистент
paths:
  /api/admin/v1/analytics:
    get:
      description: |
        Считается по заявкам с левым соединением на сделку: заявка, не ставшая
        сделкой, обязана попасть в отчёт — иначе конверсия везде равна единице.

        Незаполненное значение разреза показывается как «—», а не прячется:
        заявки без кампании — это тоже ответ.
      operationId: report
      parameters:
      - description: "Разрез: product, source, language или campaign."
        in: query
        name: by
        required: false
        schema:
          type: string
          default: source
      - description: "Начало периода включительно, `YYYY-MM-DD`. Пусто — с начала."
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date
      - description: "Конец периода включительно, `YYYY-MM-DD`. Пусто — по сегодня\
          ."
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CrmAnalytics"
          description: OK
      security:
      - keycloak: []
      summary: Воронка в одном разрезе за период
      tags:
      - "Админка: аналитика CRM"
  /api/admin/v1/analytics/dimensions:
    get:
      operationId: dimensions
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: string
          description: OK
      security:
      - keycloak: []
      summary: Разрезы отчёта
      tags:
      - "Админка: аналитика CRM"
  /api/admin/v1/assistant/ask:
    post:
      description: |
        То же, что публичная дверь, но область поиска шире: к каталогу,
        ленте и публичным документам добавляются документы уровня
        `internal`.

        Документы уровня `confidential` не входят и сюда. Вход в админку
        не является тем «отдельным разрешением», по которому их выдают:
        они не фильтруются из ответа, а вообще не попадают в контекст
        поиска.

        Ограничения те же, что на публичной двери: вопрос про диагноз
        или цену отклоняется до поиска. Не нашлось источников — приходит
        `handoff`, а не выдуманный ответ.

        В журнале действие записывается на того, кто спросил.
      operationId: ask
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AskReply"
          description: Ответ со ссылками на источники либо передача человеку.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Вопрос пуст или длиннее 500 символов.
      security:
      - keycloak: []
      summary: Спросить Ведалину по внутренним материалам
      tags:
      - "Админка: ассистент"
  /api/admin/v1/audit:
    get:
      operationId: entries
      parameters:
      - description: "Тип объекта: product, news, document, lead, category."
        in: query
        name: subject
        required: false
        schema:
          type: string
      - description: Идентификатор объекта — slug или UUID заявки.
        in: query
        name: subjectId
        required: false
        schema:
          type: string
      - description: Логин исполнителя.
        in: query
        name: actor
        required: false
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Page"
          description: OK
      security:
      - keycloak: []
      summary: "Журнал постранично, свежие сверху"
      tags:
      - "Админка: журнал"
  /api/admin/v1/audit/chain/{correlationId}:
    get:
      description: "Цепочка собирается по correlation_id и переживает границу план\
        ировщика: relay работает в другом потоке, и без этого связь письма с заявк\
        ой, которая его породила, теряется."
      operationId: chain
      parameters:
      - in: path
        name: correlationId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"
          description: OK
      security:
      - keycloak: []
      summary: Весь путь одного запроса
      tags:
      - "Админка: журнал"
  /api/admin/v1/categories:
    get:
      operationId: categories
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminCategory"
          description: OK
      security:
      - keycloak: []
      summary: Категории каталога
      tags:
      - "Админка: каталог"
    post:
      operationId: createCategory
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCategoryForm"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminCategory"
          description: OK
      security:
      - keycloak: []
      summary: Завести категорию
      tags:
      - "Админка: каталог"
  /api/admin/v1/categories/{id}:
    delete:
      description: "Отклоняется, если в категории есть изделия: в схеме на связке\
        \ стоит on delete restrict."
      operationId: deleteCategory
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
      security:
      - keycloak: []
      summary: Удалить категорию
      tags:
      - "Админка: каталог"
    put:
      operationId: updateCategory
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCategoryForm"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminCategory"
          description: OK
      security:
      - keycloak: []
      summary: Правка категории
      tags:
      - "Админка: каталог"
  /api/admin/v1/chats:
    get:
      description: Последние сверху.
      operationId: all
      parameters:
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Page"
          description: OK
      security:
      - keycloak: []
      summary: Все разговоры
      tags:
      - "Админка: чат"
  /api/admin/v1/chats/queue:
    get:
      description: |
        Разговоры в состоянии `waiting`, дольше ждущие первыми. Это и есть
        работа: разговор попадает сюда, когда Ведалина не нашла ответа
        и передала человеку.
      operationId: queue
      parameters:
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Page"
          description: OK
      security:
      - keycloak: []
      summary: "Очередь: кто ждёт живого ответа"
      tags:
      - "Админка: чат"
  /api/admin/v1/chats/stream:
    get:
      description: |
        Поток событий (`text/event-stream`) для рабочего места: приходит
        `changed` с идентификатором разговора, в котором что-то изменилось.
        Ни текста, ни автора — их сотрудник забирает обычным запросом ленты,
        который проходит проверку прав.

        Нужен, чтобы очередь не приходилось перезагружать руками: разговор,
        попавший в ожидание, должен появиться на экране сам.
      operationId: stream
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SseEmitter"
          description: OK
      security:
      - keycloak: []
      summary: Поток обновлений по всем разговорам
      tags:
      - "Админка: чат"
  /api/admin/v1/chats/{id}:
    get:
      operationId: thread
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Thread"
          description: Разговора нет.
      security:
      - keycloak: []
      summary: Лента разговора
      tags:
      - "Админка: чат"
  /api/admin/v1/chats/{id}/close:
    post:
      description: "Посетитель, написав снова, заведёт новый."
      operationId: close
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Разговора нет.
      security:
      - keycloak: []
      summary: Закрыть разговор
      tags:
      - "Админка: чат"
  /api/admin/v1/chats/{id}/messages:
    post:
      description: |
        Ответ и есть взятие разговора: сотрудник становится ответственным,
        состояние переходит в `attended`. Отдельной кнопки «взять» нет
        намеренно — взятый, но не отвеченный разговор пропадает из очереди,
        а посетитель ждёт ровно так же, как ждал.

        С этого момента Ведалина в разговоре молчит.
      operationId: reply
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatReply"
        required: true
      responses:
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Thread"
          description: Разговора нет.
      security:
      - keycloak: []
      summary: Ответить посетителю
      tags:
      - "Админка: чат"
  /api/admin/v1/chats/{id}/personal-data:
    delete:
      description: |
        Стирает тела всех сообщений — и посетителя, и сотрудника, и Ведалины:
        сотрудник в ответе повторяет имя и телефон чаще, чем кажется,
        а ответ ассистента цитирует вопрос.

        Сама лента остаётся: по ней видно, что разговор был, сколько длился
        и чем кончился. Удалить его целиком значит потерять след работы
        сотрудника — а работа была, и за неё отвечали.
      operationId: eraseConversation
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
          description: Уничтожено либо уже было уничтожено.
        "404":
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
          description: Разговора нет.
      security:
      - keycloak: []
      summary: Уничтожить персональные данные разговора
      tags:
      - "Админка: персональные данные"
  /api/admin/v1/chats/{id}/typing:
    post:
      description: |
        Показывает посетителю «отвечают…». Ничего не записывает: факт живёт
        секунды. Уходит только тому посетителю, чей это разговор.

        Нужно ровно для одного — чтобы человек не ушёл со страницы за те
        полминуты, пока сотрудник формулирует. Молчание в чате читается
        как «меня не слышат».
      operationId: typing
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Принято.
      security:
      - keycloak: []
      summary: Сотрудник набирает ответ
      tags:
      - "Админка: чат"
  /api/admin/v1/clients:
    get:
      operationId: clients
      parameters:
      - description: Поиск по наименованию и ИНН. Пусто — все.
        in: query
        name: query
        required: false
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: "Размер страницы, не больше 200."
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Page"
          description: OK
      security:
      - keycloak: []
      summary: "Клиенты постранично, по алфавиту"
      tags:
      - "Админка: клиенты"
    post:
      operationId: create_5
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminClientForm"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminClient"
          description: Created
      security:
      - keycloak: []
      summary: Завести клиента
      tags:
      - "Админка: клиенты"
  /api/admin/v1/clients/kinds:
    get:
      operationId: kinds
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: string
          description: OK
      security:
      - keycloak: []
      summary: Виды клиента
      tags:
      - "Админка: клиенты"
  /api/admin/v1/clients/{id}:
    get:
      operationId: client
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminClient"
          description: OK
      security:
      - keycloak: []
      summary: Карточка клиента
      tags:
      - "Админка: клиенты"
    put:
      description: "Форма отправляется вместе с версией прочитанной карточки. Расх\
        ождение версий — `409`: сохранить вслепую значит затереть чужую правку."
      operationId: update_5
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminClientForm"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminClient"
          description: OK
      security:
      - keycloak: []
      summary: Править карточку клиента
      tags:
      - "Админка: клиенты"
  /api/admin/v1/clients/{id}/history:
    get:
      operationId: history_2
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminInteraction"
          description: OK
      security:
      - keycloak: []
      summary: История переписки и звонков по клиенту
      tags:
      - "Админка: клиенты"
    post:
      description: "История только дописывается: правки и удаления здесь нет. Исто\
        рию, которую можно поправить задним числом, незачем вести."
      operationId: addToHistory_2
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminNewInteraction"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminInteraction"
          description: Created
      security:
      - keycloak: []
      summary: Дописать в историю клиента
      tags:
      - "Админка: клиенты"
  /api/admin/v1/clients/{id}/personal-data:
    delete:
      description: |
        Стирает почту, телефон и заметку. Наименование — только у частного
        лица: у организации это её название, и стерев его мы получили бы
        сделки, подписанные словом «удалено».

        История переписки по клиенту стирается вместе с карточкой: там
        персональных данных обычно больше, чем в самих полях.
      operationId: eraseClient
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
          description: Уничтожено либо уже было уничтожено.
        "404":
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
          description: Клиента нет.
      security:
      - keycloak: []
      summary: Уничтожить персональные данные клиента
      tags:
      - "Админка: персональные данные"
  /api/admin/v1/deals:
    get:
      operationId: deals
      parameters:
      - description: "Фильтр по воронке: sales, dealer, service. Пусто — все."
        in: query
        name: pipeline
        required: false
        schema:
          type: string
      - description: Фильтр по стадии. Работает вместе с воронкой.
        in: query
        name: stage
        required: false
        schema:
          type: string
      - description: Все сделки одного клиента. Перекрывает фильтр по воронке.
        in: query
        name: clientId
        required: false
        schema:
          type: string
          format: uuid
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: "Размер страницы, не больше 200."
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Page"
          description: OK
      security:
      - keycloak: []
