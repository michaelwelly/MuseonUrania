      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
      security:
      - keycloak: []
      summary: Удалить материал
      tags:
      - "Админка: новости"
    get:
      operationId: item
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminNews"
          description: OK
      security:
      - keycloak: []
      summary: Материал целиком
      tags:
      - "Админка: новости"
    put:
      operationId: update_1
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminNewsForm"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminNews"
          description: OK
      security:
      - keycloak: []
      summary: Правка материала
      tags:
      - "Админка: новости"
  /api/admin/v1/news/{id}/publish:
    post:
      description: Без даты в ленте публикация отклоняется — это ограничение схемы
        news_published_needs_date.
      operationId: publish_1
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminNews"
          description: OK
      security:
      - keycloak: []
      summary: Опубликовать материал
      tags:
      - "Админка: новости"
  /api/admin/v1/news/{id}/unpublish:
    post:
      operationId: unpublish_1
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminNews"
          description: OK
      security:
      - keycloak: []
      summary: Снять материал с публикации
