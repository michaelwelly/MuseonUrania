  /api/admin/v1/news/{id}/unpublish:
    post:
      operationId: unpublish_1
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminNews"
          description: OK
      security:
      - keycloak: []
      summary: Снять материал с публикации
      tags:
      - "Админка: новости"
  /api/admin/v1/products:
    get:
      operationId: products
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminProductRow"
          description: OK
      security:
      - keycloak: []
      summary: "Все изделия, включая неопубликованные"
      tags:
      - "Админка: каталог"
    post:
      description: Создаётся неопубликованным. Публикация — отдельным действием.
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProductForm"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminProduct"
          description: OK
      security:
      - keycloak: []
      summary: Завести изделие
      tags:
      - "Админка: каталог"
  /api/admin/v1/products/{id}:
    get:
      operationId: product
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminProduct"
          description: OK
      security:
      - keycloak: []
      summary: Изделие целиком
      tags:
      - "Админка: каталог"
    put:
      description: "Переименование опубликованного изделия отклоняется: адрес карт\
        очки уже разослан и проиндексирован."
      operationId: update_1
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProductForm"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminProduct"
          description: OK
      security:
      - keycloak: []
      summary: Правка изделия
      tags:
      - "Админка: каталог"
  /api/admin/v1/products/{id}/publish:
    post:
      operationId: publish
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminProduct"
          description: OK
      security:
      - keycloak: []
      summary: Опубликовать изделие
      tags:
      - "Админка: каталог"
  /api/admin/v1/products/{id}/unpublish:
    post:
      description: Изделие сразу пропадает с сайта. Данные остаются.
      operationId: unpublish
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminProduct"
          description: OK
      security:
      - keycloak: []
      summary: Снять изделие с публикации
      tags:
      - "Админка: каталог"
  /api/admin/v1/quotes:
    get:
      operationId: quotes
      parameters:
      - description: Фильтр по статусу. Пусто — все.
        in: query
        name: status
        required: false
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: "Размер страницы, не больше 200."
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Page"
          description: OK
      security:
      - keycloak: []
      summary: "КП постранично, свежие сверху"
      tags:
      - "Админка: коммерческие предложения"
    post:
      description: "Новое КП — черновик со своим номером. Номер выдаёт последовате\
        льность базы: двое, нажавшие «создать» одновременно, получат разные номера\
        ."
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminNewQuote"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminQuote"
          description: Created
      security:
      - keycloak: []
      summary: Завести КП по сделке
      tags:
      - "Админка: коммерческие предложения"
  /api/admin/v1/quotes/statuses:
    get:
      operationId: statuses
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: string
          description: OK
      security:
      - keycloak: []
      summary: Статусы КП
      tags:
      - "Админка: коммерческие предложения"
  /api/admin/v1/quotes/{id}:
    get:
      operationId: quote
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminQuote"
          description: OK
      security:
      - keycloak: []
      summary: "КП целиком, вместе с позициями"
      tags:
      - "Админка: коммерческие предложения"
    put:
      description: |
        Правится только черновик. Отправленное КП уже лежит у клиента в почте,
        и правка задним числом означала бы, что портал и клиент держат разные
        версии одного предложения. Нужны другие условия — заведите новое КП.

        Позиции заменяются целиком: редактор видит их одним списком.
      operationId: update
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminQuoteForm"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminQuote"
          description: OK
      security:
      - keycloak: []
      summary: Править КП
      tags:
      - "Админка: коммерческие предложения"
  /api/admin/v1/quotes/{id}/decision:
    post:
      description: "Только по отправленному: клиент не может согласиться с тем, че\
        го не получал."
      operationId: decide
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminQuoteDecision"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminQuote"
          description: OK
      security:
      - keycloak: []
      summary: Решение клиента по КП
      tags:
      - "Админка: коммерческие предложения"
  /api/admin/v1/quotes/{id}/send:
    post:
      description: |
        Письмо портал пока не шлёт: `MailSender` пишет в лог, SMTP Яндекс 360 —
        следующий шаг. Отметка фиксирует, что предложение ушло, и с этого момента
        оно не правится.
      operationId: send
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminQuote"
          description: OK
      security:
      - keycloak: []
      summary: Отметить КП отправленным
      tags:
      - "Админка: коммерческие предложения"
  /api/admin/v1/session:
    get:
      operationId: session
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminSession"
          description: OK
      security:
      - keycloak: []
      summary: Кто вошёл
      tags:
      - "Админка: сессия"
  /api/admin/v1/staff:
    get:
      description: |
        Список из провайдера идентичности: в режиме `keycloak` — пользователи
        realm'а, в запасном `local` — таблица `admin_user`.

        Отключённые остаются в списке: на них есть старые заявки и сделки,
        и прятать их значит терять историю. Форма предлагает их выбирать
        только тем записям, где они уже стоят.
      operationId: staff
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminStaffMember"
          description: OK
      security:
      - keycloak: []
      summary: Сотрудники для выбора ответственного
      tags:
      - "Админка: сотрудники"
components:
  schemas:
    AdminCategory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: integer
          format: int32
        productCount:
          type: integer
          format: int64
        slug:
          type: string
    AdminCategoryForm:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 0
        position:
          type: integer
          format: int32
        slug:
          type: string
          minLength: 1
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      required:
      - name
      - slug
    AdminClient:
      type: object
      description: |
        Карточка клиента вместе с контактами и реквизитами. Контакты —
        персональные данные: дверь закрыта аутентификацией, и каждое
        изменение попадает в журнал.
      properties:
        city:
          type: string
        country:
          type: string
        createdAt:
          type: string
          format: date-time
        email:
          type: string
        externalId:
          type:
          - string
          - "null"
          description: Идентификатор контрагента во внешней системе. Заведён под будущий
            обмен с 1С; сам обмен не подтверждён.
        id:
          type: string
          format: uuid
        inn:
          type: string
        kind:
          type: string
        kpp:
          type: string
        name:
          type: string
        note:
          type: string
        owner:
          type: string
        phone:
          type: string
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          description: "Версия карточки. Её надо вернуть в форме правки, иначе сох\
            ранение затрёт чужую правку вслепую."
    AdminClientForm:
      type: object
      description: Форма карточки клиента.
      properties:
        city:
          type: string
          example: Екатеринбург
          maxLength: 200
          minLength: 0
        country:
          type: string
          example: Россия
          maxLength: 100
          minLength: 0
        email:
          type:
          - string
          - "null"
          format: email
          description: Почта для переписки.
          example: info@example.ru
        externalId:
          type:
          - string
          - "null"
          description: "Идентификатор контрагента во внешней системе, под будущий\
            \ обмен с 1С."
          maxLength: 200
          minLength: 0
        inn:
          type:
          - string
          - "null"
          description: "ИНН: 10 цифр у организации, 12 у предпринимателя."
          example: "5406826069"
          pattern: "^$|^\\d{10}$|^\\d{12}$"
        kind:
          type: string
          enum:
          - company
          - person
          example: company
          minLength: 1
          pattern: company|person
        kpp:
          type:
          - string
          - "null"
          description: "КПП: 9 цифр."
          example: "540601001"
          pattern: "^$|^\\d{9}$"
        name:
          type: string
          description: Наименование организации или ФИО.
          example: Областной перинатальный центр
          maxLength: 300
          minLength: 0
        note:
          type:
          - string
          - "null"
          description: Заметка менеджера.
        owner:
          type:
          - string
          - "null"
          description: Логин ответственного. Пусто — снять ответственного.
          maxLength: 200
          minLength: 0
        phone:
          type: string
          example: +7 343 300-00-00
          maxLength: 100
          minLength: 0
        version:
          type:
          - integer
          - "null"
          format: int64
          description: Версия прочитанной карточки. При создании не нужна.
      required:
      - kind
      - name
    AdminDeal:
      type: object
      description: Карточка сделки вместе с вложениями.
      properties:
        amount:
          type: number
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/AdminDealAttachment"
        clientId:
          type: string
          format: uuid
        clientName:
          type: string
        closedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        currency:
          type: string
        id:
          type: string
          format: uuid
        leadId:
          type:
          - string
          - "null"
          format: uuid
          description: "Заявка, из которой заведена сделка. Пусто у сделки, заведё\
            нной руками."
        lostReason:
          type: string
        lostStages:
          type: array
          description: "Стадии, которыми эта воронка заканчивается отказом. Перево\
            д в такую стадию требует причины проигрыша: форма спрашивает её до наж\
            атия, а не после отказа."
          items:
            type: string
        owner:
          type: string
        pipeline:
          type: string
        productSlug:
          type: string
        stage:
          type: string
        stages:
          type: array
          description: "Стадии этой воронки, по порядку. Форма рисует выбор из них\
            , а не свободное поле."
          items:
            type: string
        title:
          type: string
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          description: Версия карточки. Её надо вернуть в форме правки.
        wonStages:
          type: array
          description: "Стадии, которыми эта воронка заканчивается успехом."
          items:
            type: string
    AdminDealAttach:
      type: object
      description: Приложить согласованный документ к сделке.
      properties:
        documentId:
          type: string
          format: uuid
      required:
      - documentId
    AdminDealAttachment:
      type: object
      description: |
        Приложенный документ. Хранится ссылка на карточку, а не копия файла:
        копия разошлась бы с оригиналом при замене ревизии.
      properties:
        attachedAt:
          type: string
          format: date-time
        attachedBy:
          type: string
        documentId:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
    AdminDealForm:
      type: object
      description: Правка карточки сделки. Стадия меняется отдельно.
      properties:
        amount:
          type: number
          example: 2650000.0
          minimum: 0
        currency:
          type: string
          pattern: "^$|^[A-Z]{3}$"
        owner:
          type: string
          maxLength: 200
          minLength: 0
        productSlug:
          type: string
        title:
          type: string
          example: Поставка двух систем VEDAL R2
          maxLength: 300
          minLength: 0
        version:
          type:
          - integer
          - "null"
          format: int64
          description: Версия прочитанной карточки.
      required:
      - title
    AdminDealStage:
      type: object
      description: |
        Перевод сделки на другую стадию. Воронка не меняется: сделка,
        переехавшая из продаж в сервис, — это две разные сделки.
      properties:
        lostReason:
          type:
          - string
          - "null"
          description: "Причина проигрыша. Обязательна при переводе в проигранную\
            \ стадию: воронка без причин показывает, сколько потеряли, и молчит о\
            \ том, почему."
          maxLength: 500
          minLength: 0
        stage:
          type: string
          description: Стадия из воронки этой сделки. Список приходит в карточке и
            в `GET /deals/pipelines`.
          example: qualified
          minLength: 1
      required:
      - stage
    AdminDocumentForm:
      type: object
      properties:
        access:
          type: string
          description: "Планируемый уровень доступа, бейдж на сайте."
          enum:
          - pdf
          - on_request
          - pending
          minLength: 1
        group:
          type: string
          description: Раздел перечня.
          enum:
          - Лицензирование
          - Система качества
          - Техническая документация
          - Коммерческие материалы
          minLength: 1
        listed:
          type: boolean
          description: Строка видна в публичном перечне. Это не публикация файла.
        productSlug:
          type:
          - string
          - "null"
          description: "Изделие, к которому привязан документ."
          maxLength: 200
          minLength: 0
        revision:
          type: string
          maxLength: 100
          minLength: 0
        sensitivity:
          type: string
          description: "Уровень секретности. Опубликовать можно только `public` —\
            \ это ограничение схемы, а не дисциплина редактора."
          enum:
          - public
          - internal
          - confidential
          minLength: 1
        slug:
          type: string
          minLength: 1
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        sourceOwner:
          type: string
          maxLength: 200
          minLength: 0
        subject:
          type: string
          description: К чему относится документ.
          example: "VEDAL R1, R2"
          maxLength: 300
          minLength: 0
        title:
          type: string
          maxLength: 300
          minLength: 0
        version:
          type:
          - integer
          - "null"
          format: int64
          description: "Версия карточки, прочитанная перед правкой. Обязательна пр\
            и обновлении, при создании игнорируется."
      required:
      - access
      - group
      - sensitivity
      - slug
      - subject
      - title
    AdminDocumentRow:
      type: object
      description: Строка списка документов в админке.
      properties:
        access:
          type: string
        approvedBy:
          type: string
        fileSize:
          type: integer
          format: int64
        group:
          type: string
        hasFile:
          type: boolean
        id:
          type: string
          format: uuid
        listed:
          type: boolean
        productSlug:
          type: string
        publishBlockedBy:
          type:
          - string
          - "null"
          description: "Почему документ нельзя опубликовать прямо сейчас. `null` —\
            \ можно. Считается по тем же правилам, что закрыты ограничениями схемы\
            , чтобы кнопка объясняла отказ заранее."
        published:
          type: boolean
        revision:
          type: string
        sensitivity:
          type: string
        slug:
          type: string
        subject:
          type: string
        title:
          type: string
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          description: Версия карточки. Её надо вернуть в форме правки.
    AdminInteraction:
      type: object
      description: |
        Запись истории. Текст — персональные данные: наружу и в топики
        не уходит, туда идёт только идентификатор.
      properties:
        actor:
          type: string
        at:
          type: string
          format: date-time
        body:
          type: string
        clientId:
          type: string
          format: uuid
        dealId:
          type: string
          format: uuid
        direction:
          type: string
        id:
          type: string
          format: uuid
        kind:
          type: string
        leadId:
          type: string
          format: uuid
        subject:
          type: string
    AdminLead:
      type: object
      description: "Заявка целиком, вместе с текстом и согласием."
      properties:
        campaign:
          type:
          - string
          - "null"
          description: "Кампания, приведшая посетителя. Разрез аналитики."
        company:
          type: string
        consentAt:
          type: string
          format: date-time
        consentVersion:
          type: string
          description: "Версия текста согласия, с которым человек согласился. Хран\
            ится версия, а не галочка: через год иначе не доказать, с чем именно о\
            н согласился."
        correlationId:
          type:
          - string
          - "null"
          description: Идентификатор цепочки запроса. По нему в журнале собирается
            весь путь заявки.
        createdAt:
          type: string
          format: date-time
        dealId:
          type:
          - string
          - "null"
          format: uuid
          description: "Сделка, в которую разобрана заявка."
        email:
          type: string
        erasedAt:
          type:
          - string
          - "null"
          format: date-time
          description: "Когда персональные данные заявки уничтожены. Пусто — не ун\
            ичтожались. Нужно интерфейсу, чтобы отличить исполненное обращение от\
            \ сбоя: без этой отметки слово «удалено» в полях выглядит одинаково в\
            \ обоих случаях."
